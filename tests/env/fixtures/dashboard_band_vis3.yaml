# TEST FIXTURE — NOT A MAINTAINED WORLD. Do not train in it, do not record from it.
#
# WHY IT EXISTS. `tests/env/test_dashboard_band_span.py` protects the band-width
# fix of commit 4b6f7196: the layout registry used to declare vision at range 3 a
# panel 616 px wide against a real requirement of 482 px, and the packer, which
# keeps a declaration absolutely, refused to lay out the frame at all — the whole
# episode video failed to render. Range 3 is the condition that fix exists for,
# and it is the widest sense panel the packer is ever asked to place.
#
# It used to be covered by `basic/05-campfire_thermal_10x10_olf1_vis3.yaml`, a
# maintained config that set `visual_sensor_range: 3`. Commit 47b1b8c3 moved the
# project default to the sensor ladder's Q2 arm (olfaction radius 1, vision
# radius 2) and deleted that file, so no maintained world reads sight at range 3
# any more. The regression test then SKIPPED and passed while asserting nothing.
# This fixture puts the condition back under the test's own control, where the
# maintained ladder is free to move without silently voiding the coverage.
#
# WHAT IT CHANGES, and nothing else: one key, the visual sampling radius.
#   sensory.visual_sensor_range: 2 (inherited) -> 3   Manhattan diamond, 25 cells
#
# WHAT IT DOES NOT RESTORE, recorded so nobody assumes otherwise. The 616-vs-482
# px arithmetic of the original bug was SIX maps wide, because vision then
# returned eight channels and grass/sand/plain share one categorical map. Commit
# 47b1b8c3 also set `visual_vector_size: 1`, so this world draws ONE map and
# declares 102 px where it used to declare 616. Pinning the vector back to 8 here
# is not possible as a thin override: `visual_properties` is length-1 on every
# entity of the ladder, and the loader rejects the mismatch
# (`Resource(food): 'visual_properties' has length 1 but visual_vector_size is 8`),
# so it would take a standalone copy of the whole world. The six-map arithmetic
# is therefore covered synthetically instead, by the `visual_r3` cases of
# `test_the_declared_minimum_is_exactly_what_the_painter_needs` and
# `test_the_painter_draws_at_the_declared_minimum_and_refuses_one_pixel_less`,
# which build their own eight-channel context. What THIS fixture covers is the
# end-to-end half those cannot reach: a real config at range 3 that the packer
# must place and the painter must draw into.
#
# NOTE the nesting: the key lives under the TOP-LEVEL `sensory:` block in
# environment/default.yaml, NOT under `environment:`. An override placed under
# `environment:` layers cleanly and silently changes nothing.
#
# `extends:` targets resolve under `configs/` regardless of where this file sits,
# so a fixture outside that tree may still inherit a maintained world.
extends: environment/experiment/basic/05-campfire_thermal_10x10

sensory:
  visual_sensor_range: 3
