# ═══════════════════════════════════════════════════════════════════════════
# FROZEN PARITY WORLD — DO NOT UPDATE TO MATCH THE LIVE CONFIG.
#
# WHAT THIS IS
#   A pinned, PRE-RESOLVED pre-change form of `configs/environment/experiment/basic/01-slow_predator_5x5.yaml`, kept as a
#   TEST INPUT so that the byte-parity fixtures captured against this world keep
#   testing the world they were captured in.
#
# WHY IT EXISTS
#   On 2026-09-14 the bush gained `blocks_animals: true` (commit A1 of
#   [[BUSH_REFUGE_AND_LOCATION_DEPENDENT_RECOVERY]]), making a bush impassable to
#   animals. That is a deliberate behaviour change to the LIVE world. It moved
#   animal trajectories, and with them the observations that three REFACTOR-parity
#   gates pin:
#       tests/env/test_unified_parity.py      (fixtures: tests/env/fixtures/parity/)
#       tests/env/test_visual_parity.py       (fixtures: tests/env/fixtures/visual_parity/)
#       tests/env/test_directional_sensors.py (fixture:  tests/env/fixtures/directional_sensors/)
#   Those three gates do NOT test "is today's world still correct". They test
#   "did a PAST refactor change observations" — the DIRECTIONAL_SENSORS sensor
#   rewrite and the unified-animal refactor. Their fixtures are evidence about
#   code that shipped long ago. Re-baselining them against the post-A1 world would
#   silently destroy that evidence, so the world is frozen instead of the fixture.
#
# THE DISTINCTION THAT MATTERS (read before "fixing" any inconsistency here)
#   tests/env/fixtures/thermal_parity/ is DELIBERATELY the opposite. It tracks the
#   CURRENT world and reads the LIVE configs. Going red on an intended behaviour
#   change is its loudness function — that is why A1 regenerated its one affected
#   fixture rather than freezing anything. Four fixture families, two purposes:
#       thermal_parity/  -> tracks the live world     -> regenerate on intent
#       parity/, visual_parity/, directional_sensors/ -> pin a past refactor
#                                                     -> freeze the world instead
#   These are not inconsistent with each other. Do not "harmonise" them.
#
# PROVENANCE
#   Taken from git, not from a working copy: `git show f02e76b9:configs/environment/experiment/basic/01-slow_predator_5x5.yaml`
#   Frozen commit: f02e76b9cef16e17252bd5d4bbde215104638cd6
#   Frozen on:     2026-09-14
#
# MAINTENANCE
#   DO NOT edit this file to match the live config. If a future change makes one of
#   the three gates above red, the question is "did that change alter observations
#   the past refactor promised to preserve?" — not "how do I make this file current".
#
# PRE-RESOLVED (the one deviation from a byte copy, and it is load-bearing):
#   the original carried `extends: environment/default`, and `extends:` targets
#   resolve ONLY under `configs/` (config_loader.py::_resolve_extends). A byte
#   copy would therefore still read the LIVE base file, so freezing this file
#   alone would not freeze its world — a later edit to the live
#   `configs/environment/default.yaml` would leak in and redden the gate again,
#   which is exactly what this directory exists to stop. So the `extends:` chain
#   was resolved AT THE FROZEN COMMIT and inlined, using the loader's own merge
#   order (base first, this file's keys on top) with the `extends:` key stripped,
#   making this a standalone config with no live coupling at all.
#   Equivalence is not asserted here — it is PROVEN by the gate: this world
#   reproduces the pinned pre-change fixture byte-for-byte, or the test fails.
# ═══════════════════════════════════════════════════════════════════════════
