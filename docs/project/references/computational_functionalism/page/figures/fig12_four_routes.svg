   <g id="text_1">
    <text style="font-weight: 600; font-size: 15px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #16181d" x="10.08" y="24.95715" transform="rotate(-0 10.08 24.95715)">Four reviewed works, four reasons, one verdict — and no premise in common</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 600; font-size: 13px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #1f7f8c" x="39.545856" y="71.260141" transform="rotate(-0 39.545856 71.260141)">Tononi &amp; Koch 2015</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: end; fill: #6e747e" x="419.328" y="70.870922" transform="rotate(-0 419.328 70.870922)">Consciousness science  ·  D §1, p. 15</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 89.633037)">A simulation is virtual; consciousness is real intrinsic cause-effect</text>
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 102.828397)">power. “A computer simulation of a giant star will not bend space–time</text>
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 115.637811)">around the machine.”</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 600; font-size: 13px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #6d4fb3" x="39.545856" y="152.065741" transform="rotate(-0 39.545856 152.065741)">Searle 1980</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: end; fill: #6e747e" x="419.328" y="151.735819" transform="rotate(-0 419.328 151.735819)">Philosophy of mind  ·  B §1, p. 424</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 170.320044)">Intentionality is a biological phenomenon. “No one would suppose that we</text>
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 183.623684)">could produce milk and sugar by running a computer simulation of…</text>
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 196.767223)">lactation and photosynthesis.”</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 600; font-size: 13px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #8a5a2b" x="39.545856" y="233.093763" transform="rotate(-0 39.545856 233.093763)">Klein 2016 (draft)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: end; fill: #6e747e" x="419.328" y="232.541419" transform="rotate(-0 419.328 232.541419)">Philosophy of computation  ·  F §2, PDF p. 16</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 251.125644)">A virtual machine is not a process that actually has an architecture — a</text>
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 264.150589)">conclusion reached while DEFENDING computationalism, and called</text>
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 277.185847)">“suspiciously close to… Searle”.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 600; font-size: 13px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #1f7f8c" x="39.545856" y="313.676941" transform="rotate(-0 39.545856 313.676941)">Seth 2025</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: end; fill: #6e747e" x="419.328" y="313.169129" transform="rotate(-0 419.328 313.169129)">Consciousness science  ·  C §5 §3.7</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 331.931244)">Simulating a mechanism is neither implementing nor realising it.</text>
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(39.545856 345.234884)">“Nothing gets wet in a weather forecasting computer.”</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e747e" x="673.06176" y="201.920489" transform="rotate(-0 673.06176 201.920489)">the shared verdict</text>
   </g>
   <g id="text_15">
    <text style="font-size: 13px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(583.124104 216.87415)">A detailed computer simulation</text>
    <text style="font-size: 13px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #16181d" transform="translate(575.420588 231.872392)">of a brain would not be conscious</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #6e747e" transform="translate(488.90016 127.249679)">kinship claimed in an</text>
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #6e747e" transform="translate(488.90016 139.162765)">endnote, not argued</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4e545e" x="22.35744" y="380.60328" transform="rotate(-0 22.35744 380.60328)">The cards are deliberately not joined to one another: merging them would draw a consensus that does not exist.</text>
   </g>
  </g>
 </g>
