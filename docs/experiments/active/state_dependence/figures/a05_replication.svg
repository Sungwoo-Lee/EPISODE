   <g id="text_22">
    <text style="font-weight: 600; font-size: 10px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #4e545e" transform="translate(130.733125 17.4925)">Does the modulator change how threat-response grows with injury?</text>
    <text style="font-weight: 600; font-size: 10px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #4e545e" transform="translate(130.733125 28.4875)">Zero means it changed nothing. The bands are two estimates of how far apart two runs land when</text>
    <text style="font-weight: 600; font-size: 10px; font-family: 'Pretendard', 'system-ui', 'DejaVu Sans', sans-serif; fill: #4e545e" transform="translate(130.733125 39.4825)">only the random seed differs — which band you trust decides how much of this is 'significant'.</text>
   </g>
