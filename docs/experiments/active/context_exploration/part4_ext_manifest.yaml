  - {id: C4,  world: g20r5f4to16b12, seed: 42, wandb_id: 7ctxxltq, log: [logs/20260927_184752.log, logs/20260927_232518.log], tag: rppo_ctxexp_g20r5f4to16b12_t1none_s42, config: configs/environment/experiment/context_exploration/g20r5f4to16b12.yaml}
