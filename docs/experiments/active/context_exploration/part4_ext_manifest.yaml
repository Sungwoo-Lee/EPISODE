# Part 4 extension manifest (R1.4) - input to scripts/analysis/studies/context_exploration/part4_readout.py.
# The four runs resumed in place from their 2 M checkpoints to 5 M episodes (STUDY_PLAN.md 4.9 rows
# C1a-ext, C1b-ext, C3-ext, C4-ext). Every wandb/run-*-<id>/ folder of a run is merged (the 2 M
# session, the 23:12 launch that crashed at restore with no rows, the 23:25 resumed session).
# Windows fixed in "Part 4 extension - readings fixed before the 5 M read-out" (commit 82ddae14):
# read-out 4.9-5.0 M, still-learning 4.8-5.0 M vs 4.6-4.8 M, seam at 2 M with 200 k blocks +- 5 %.
# World rows and sim values copied from part4_manifest.yaml (4.2).
study: context_exploration
design_doc: docs/experiments/active/context_exploration/STUDY_PLAN.md
episodes: 5000000
readout_fraction: 0.02          # = readout_window / episodes (kept for the script's default path)
readout_window: 100000
still_learning_window: 200000
block_size: 200000
log_every_episodes: 4000       # episode-row logging interval, counted from the (resume) start; verified from row spacing
seam: {at: 2000000, block: 200000, tol: 0.05}
calibration:
  max_nutrition: 200.0
  max_injury: 100.0
  temperature_setpoint: 0.0
  thermal_default_temp_high: -29.0
  thermal_on: true
  felt_on: true
  early_death_max_steps: 20
worlds:
  lvl05ref:        {arm: reference, grid: 10, range: 20, food: "1-4 x 12", search: 4.7,  sim_c: {1: 1, 2: 1, 4: 1, 5: 1}, sim_surv: 1.00, sim_inj: 0.99, sim_starve: 0.01}
