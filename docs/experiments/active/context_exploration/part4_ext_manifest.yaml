  g20r5f4to16b12:  {arm: balanced,  grid: 20, range: 5,  food: "4-16 x 12", search: 9.3, sim_c: {1: 1, 2: 1, 4: 1, 5: 1}, sim_surv: 0.94, sim_inj: 0.84, sim_starve: 0.16}
runs:
  - {id: C1a, world: lvl05ref,       seed: 42, wandb_id: v4tbwrfn, log: [logs/20260927_185703.log, logs/20260927_232526.log], tag: rppo_ctxexp_lvl05ref_t1none_s42,       config: configs/environment/experiment/basic/05-campfire_thermal_10x10.yaml}
  - {id: C1b, world: lvl05ref,       seed: 43, wandb_id: qxz17vr0, log: [logs/20260927_191205.log, logs/20260927_232529.log], tag: rppo_ctxexp_lvl05ref_t1none_s43,       config: configs/environment/experiment/basic/05-campfire_thermal_10x10.yaml}
