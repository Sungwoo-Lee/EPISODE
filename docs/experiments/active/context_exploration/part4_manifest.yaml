# Part 4 run manifest - input to scripts/analysis/studies/context_exploration/part4_readout.py.
# Rows copied from STUDY_PLAN.md "4.9 Launch Manifest"; sim values from "4.2 The worlds"
# (Revision-2 re-run, memory warmth trip, hazard x1). The script cross-checks each run's WandB
# tag, launch --config and seed against these rows, so a mis-mapped row fails loudly.
# wandb_dirs pins the four runs later resumed to 5 M (R1.4) to their 2 M folder, so this
# read-out still reproduces the 2 M results.
study: context_exploration
design_doc: docs/experiments/active/context_exploration/STUDY_PLAN.md
episodes: 2000000
readout_fraction: 0.10
replication_gate:            # Part 4 Revision 1, R1.6 L4 (pilots P0a / P0b at 2 M)
  C1a: {target: 228.3, tol: 4.5}
  C1b: {target: 225.8, tol: 4.5}
calibration:                 # 4.3 calibration guard
  max_nutrition: 200.0
  max_injury: 100.0
  temperature_setpoint: 0.0
  thermal_default_temp_high: -29.0
  thermal_on: true
  felt_on: true
  early_death_max_steps: 20
worlds:   # sim: criteria 1,2,4,5 pass(1)/fail(0); search = sim mean food search (steps)
  lvl05ref:        {arm: reference, grid: 10, range: 20, food: "1-4 x 12", search: 4.7,  sim_c: {1: 1, 2: 1, 4: 1, 5: 1}, sim_surv: 1.00, sim_inj: 0.99, sim_starve: 0.01}
  g10r5f1to2b36:   {arm: balanced,  grid: 10, range: 5,  food: "1-2 x 36", search: 11.8, sim_c: {1: 1, 2: 1, 4: 1, 5: 1}, sim_surv: 0.91, sim_inj: 0.81, sim_starve: 0.19}
  g20r20f1to4b12:  {arm: balanced,  grid: 20, range: 20, food: "1-4 x 12", search: 9.4,  sim_c: {1: 1, 2: 1, 4: 1, 5: 1}, sim_surv: 0.92, sim_inj: 0.85, sim_starve: 0.15}
  g20r5f4to16b12:  {arm: balanced,  grid: 20, range: 5,  food: "4-16 x 12", search: 9.3, sim_c: {1: 1, 2: 1, 4: 1, 5: 1}, sim_surv: 0.94, sim_inj: 0.84, sim_starve: 0.16}
  g20r20f1to2b36:  {arm: balanced,  grid: 20, range: 20, food: "1-2 x 36", search: 11.5, sim_c: {1: 1, 2: 1, 4: 1, 5: 1}, sim_surv: 0.91, sim_inj: 0.84, sim_starve: 0.16}
