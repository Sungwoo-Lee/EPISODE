    <span><b>Figure 5 &mdash; hiding with each animal, every world, both action rules.</b> Click a row for each seed's values.</span>
    <span><b>Axes.</b> <em>Bush dwell</em> view: columns are four test scenes &mdash; no animal, the harmless rabbit
    wandering, the rabbit chasing the agent, and the hunting predator &mdash; first unhurt (injury 0), then at the chosen
    starting injury; rows are one per world and agent (the plain level-05 reference first, then worlds 1&ndash;16, ordinary
    above modulated; the letters name the setting changes the world carries; n is the number of training seeds pooled).
    Colour and upper number: bush dwell, the share of the test's 100 steps spent on the bush (%), averaged over the
    newest 20 tested checkpoints of each seed, then over seeds. Lower number: the seed-to-seed standard deviation of the
    per-seed values, in percentage points (sample SD, n&minus;1; &ldquo;&mdash;&rdquo; with one seed), or, with
    the switch, the half-width of a 95&nbsp;% interval from redrawing the 100 layouts (a bootstrap; see How it is computed).
    <em>Contrasts</em> view: same rows; columns are differences in bush dwell, in percentage points &mdash; the injury effect
    (injured minus unhurt) per scene, the rabbit effect (wandering rabbit minus no animal) unhurt and injured, and
    rabbit &times; injury (the injured rabbit effect minus the unhurt one); orange below zero, blue above.
    <em>Greedy vs sampled</em> view: x-axis is the chosen measure (bush dwell in %, or a contrast in percentage points),
    one row per world and agent, grey dot greedy and orange dot sampled, each the mean over seeds with a line of
    &plusmn;1 seed SD.</span>
    <span><b>What it shows.</b> How much each world and agent hides with each animal when the layout changes every
    episode, how much injury and the harmless rabbit change that, and whether the answer depends on taking the most likely
    move (greedy) or drawing moves from the policy (sampled).</span>
    <span id="f5-data-stmt"></span>
    <span><details><summary><b>How it is computed.</b></summary>
    <p>Each trained agent was tested at its newest 20 saved checkpoints, 100 episodes of 100 steps per scene.
    A scene is world 1's test scene (one bush, one animal or none, healing off or on, with or without one small food
    item), but each episode places the agent, bush, animal and food at new random cells of the 10&times;10 map. The same
    100 episode seeds, so the same 100 layouts, are used at every checkpoint, in every scene and under both action
    rules, so comparisons are made on matched layouts; the predator is placed before the bush, so predator scenes match
    the others only in the agent's start and the food. <em>Greedy</em> takes the most likely move; <em>sampled</em> draws
    each move from the agent's move probabilities, as in training. Bush dwell is the share of the 100 steps spent on the
    bush. A run's value is the mean over its 20 checkpoints; rows pool training seeds (mean over seeds). Two spreads can be
    shown. The <em>seed-to-seed SD</em> says how far one seed's value typically sits from the others; with one to five
    seeds it is itself rough. The <em>layout interval</em> repeats the calculation 2,000 times on the 100 layouts redrawn
    with replacement and keeps the middle 95&nbsp;%: how much the value depends on which layouts were drawn. Neither is a
    significance test. Results in the agents' own training worlds, or at other checkpoints, may differ.</p></details></span>

<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("f5-data").textContent);
  var body = document.getElementById("f5-body");
  var M = D.meta;
  var AN = [["none", "no animal"], ["rabbitwander", "wandering rabbit"], ["rabbit", "chasing rabbit"], ["pred", "predator"]];
  var S = { view: "dwell", act: "sampled", heal: "off", food: "food", inj: "20", agent: "both", worlds: "all",
            measure: "c:rxi", sel: null, unc: "seed" };
  var CONTRASTS = [
    ["inj:none", "injury effect, no animal"], ["inj:rabbitwander", "injury effect, wandering rabbit"],
    ["inj:rabbit", "injury effect, chasing rabbit"], ["inj:pred", "injury effect, predator"],
    ["c:r0", "rabbit effect, unhurt"], ["c:r1", "rabbit effect, injured"], ["c:rxi", "rabbit × injury"]];

  function setKey() { return "heal" + S.heal + "_" + S.food + "_" + S.act; }
  function setKeyAct(act) { return "heal" + S.heal + "_" + S.food + "_" + act; }
  function mean(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
  function sd(a) { if (a.length < 2) return NaN; var m = mean(a), s = 0;
    for (var i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m); return Math.sqrt(s / (a.length - 1)); }
  function inj2(i) { return (i.length < 2 ? "0" : "") + i; }

  // per-checkpoint series of one measure for one run in one set; measure ids: "d:<animal>:<inj>" or a contrast id
  function series(set, rid, m) {
    var r = D.data[set] && D.data[set][rid]; if (!r) return null;
    var v = r.v, I = inj2(S.inj);
    function g(a, i) { return v[a + "_" + i]; }
    function diff(x, y) { return x.map(function (q, k) { return q - y[k]; }); }
    var p = m.split(":");
    if (p[0] === "d") return g(p[1], p[2] === "x" ? I : p[2]);
    if (p[0] === "inj") return diff(g(p[1], I), g(p[1], "00"));
    if (m === "c:r0") return diff(g("rabbitwander", "00"), g("none", "00"));
    if (m === "c:r1") return diff(g("rabbitwander", I), g("none", I));
    if (m === "c:rxi") return diff(diff(g("rabbitwander", I), g("none", I)), diff(g("rabbitwander", "00"), g("none", "00")));
    return null;
  }
  // the layout-error id of a page measure at the current injury (dashboard_data.py measures())
  function layId(m) { var I = inj2(S.inj), p = m.split(":");
    if (p[0] === "d") return "d:" + p[1] + ":" + (p[2] === "x" ? I : p[2]);
    if (p[0] === "inj" || m === "c:r1" || m === "c:rxi") return m + "@" + I;
    return m; }
  function layErr(set, g, m) { var L = D.lay && D.lay[set] && D.lay[set][g.world + "|" + g.agent];
    return L ? L[layId(m)] : NaN; }
  function noLay() { var L = D.lay || {};
    return S.unc === "lay" && !(S.view === "compare" ? (L[setKeyAct("sampled")] || L[setKeyAct("greedy")]) : L[setKey()]); }
  var NOLAY = "layout 95% interval: not computed yet for this set (n/a)";
  function lowerText(set, g, st, m) {
    if (S.unc === "lay") { var e = layErr(set, g, m); return isFinite(e) ? "±" + e.toFixed(1) : "n/a"; }
    return isFinite(st.s) ? "±" + st.s.toFixed(0) : "—"; }
  function runVal(set, rid, m) { var s = series(set, rid, m); return s ? mean(s) : NaN; }

  function rowsFor(set) {
    var groups = {};
    Object.keys(D.runs).forEach(function (rid) {
      if (!D.data[set] || !D.data[set][rid]) return;
      var r = D.runs[rid];
      if (S.agent !== "both" && r.agent !== S.agent) return;
      if (S.worlds === "h1" && (r.world < 1 || r.world > 8)) return;
      if (S.worlds === "h2" && r.world < 9) return;
      var k = r.world + "|" + r.agent;
      (groups[k] = groups[k] || { world: r.world, agent: r.agent, rids: [] }).rids.push(rid);
    });
    return Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) {
      return a.world - b.world || (a.agent === "ordinary" ? -1 : 1); });
  }
  function rowLabel(g, n) {
    var w = g.world === 0 ? "level 05" : "w" + g.world, ch = M.new_groups[String(g.world)];
    var tag = g.world === 0 ? "reference" : (ch === "" ? "none changed" : ch.split("").join(" "));
    return w + " " + g.agent + ' <small>· ' + tag + " · n=" + n + "</small>";
  }
  function stat(set, g, m) {
    var per = g.rids.map(function (rid) { return runVal(set, rid, m); }).filter(isFinite);
    return { m: per.length ? mean(per) : NaN, s: sd(per), n: per.length };
  }

  function lerp(c1, c2, t) {
    var a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16), o = 0;
    for (var sh = 16; sh >= 0; sh -= 8) {
      var x = (a >> sh) & 255, y = (b >> sh) & 255; o = (o << 8) | Math.round(x + (y - x) * t); }
    return "#" + ("00000" + o.toString(16)).slice(-6);
  }
  var CS = getComputedStyle(document.querySelector(".f5"));
  function tok(n) { return CS.getPropertyValue(n).trim(); }
  var SEQ = ["--hm-0", "--hm-1", "--hm-2", "--hm-3", "--hm-4"].map(tok);
  var NEG = ["--hm-0", "--neg-1", "--neg-2", "--neg-3"].map(tok), POS = ["--hm-0", "--hm-1", "--hm-3", "--hm-4"].map(tok);
  function ramp(stops, t) { t = Math.max(0, Math.min(1, t)); var k = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(k));
    return lerp(stops[i], stops[i + 1], k - i); }
  function lum(hex) { var n = parseInt(hex.slice(1), 16);
    return [16, 8, 0].map(function (sh) { var c = ((n >> sh) & 255) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); })
      .reduce(function (a, c, i) { return a + c * [0.2126, 0.7152, 0.0722][i]; }, 0); }
  function textOn(bg) { var lb = lum(bg), li = lum(tok("--ink")), cw = 1.05 / (lb + 0.05), ci = (lb + 0.05) / (li + 0.05);
    return cw > ci ? "#fff" : tok("--ink"); }
  function cellDwell(v) { return isFinite(v) ? (function (b) { return { bg: b, fg: textOn(b) }; })(ramp(SEQ, v / 100)) : { bg: tok("--surface"), fg: tok("--ink-3") }; }
  var CMAX = 40;
  function cellDiff(v) { if (!isFinite(v)) return { bg: tok("--surface"), fg: tok("--ink-3") };
    var b = ramp(v < 0 ? NEG : POS, Math.abs(v) / CMAX); return { bg: b, fg: textOn(b) }; }
  function fmt(v, signed) { if (!isFinite(v)) return "—"; var r = Math.round(v); if (r === 0) r = 0;
    return (signed && r > 0 ? "+" : "") + r; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function columns() {
    if (S.view === "dwell") {
      var c = [];
      AN.forEach(function (a) { c.push({ id: "d:" + a[0] + ":00", top: a[1], grp: 0 }); });
      AN.forEach(function (a) { c.push({ id: "d:" + a[0] + ":x", top: a[1], grp: 1 }); });
      return c;
    }
    return CONTRASTS.map(function (c, i) { return { id: c[0], top: c[1].replace(/^injury effect, /, "").replace(/^rabbit effect, /, ""), grp: i < 4 ? 0 : 1 }; });
  }
  function groupHeads() {
    if (S.view === "dwell") return ["unhurt (injury 0)", "injury " + S.inj];
    return ["injury effect: injury " + S.inj + " minus unhurt", "the harmless rabbit"];
  }

  function drawTable() {
    var set = setKey(), cols = columns(), heads = groupHeads(), rows = rowsFor(set);
    if (!rows.length) return '<p class="f5-empty">No tested runs for this selection yet.</p>';
    var nG0 = cols.filter(function (c) { return c.grp === 0; }).length, nG1 = cols.length - nG0;
    var h = '<table class="f5-grid"><thead><tr><th></th><th class="grp" colspan="' + nG0 + '">' + heads[0] +
      '</th><th class="sep"></th><th class="grp" colspan="' + nG1 + '">' + heads[1] + "</th></tr><tr><th></th>";
    cols.forEach(function (c, i) { if (i === nG0) h += '<th class="sep"></th>'; h += "<th>" + esc(c.top) + "</th>"; });
    h += "</tr></thead><tbody>";
    var prevW = null;
    rows.forEach(function (g) {
      if (prevW !== null && g.world !== prevW) h += '<tr class="f5-gap"><td colspan="' + (cols.length + 2) + '"></td></tr>';
      prevW = g.world;
      var key = g.world + "|" + g.agent, n = g.rids.length;
      h += '<tr class="f5-row' + (S.sel === key ? " f5-sel" : "") + '" tabindex="0" data-row="' + key + '" aria-expanded="' + (S.sel === key) + '"><th class="rowh" scope="row">' + rowLabel(g, n) + "</th>";
      cols.forEach(function (c, i) {
        if (i === nG0) h += '<td class="sep"></td>';
        var st = stat(set, g, c.id), col = S.view === "dwell" ? cellDwell(st.m) : cellDiff(st.m);
        h += '<td style="background:' + col.bg + ";color:" + col.fg + '">' + fmt(st.m, S.view !== "dwell") +
          "<small>" + lowerText(set, g, st, c.id) + "</small></td>";
      });
      h += "</tr>";
      if (S.sel === key) h += '<tr class="f5-drow"><td colspan="' + (cols.length + 2) + '">' + detailHTML(set, g) + "</td></tr>";
    });
    return h + "</tbody></table>";
  }

  function measureName(m) {
    var c = CONTRASTS.filter(function (x) { return x[0] === m; })[0];
    if (c) return c[1] + " (points)";
    var p = m.split(":"), a = AN.filter(function (x) { return x[0] === p[1]; })[0][1];
    return "bush dwell, " + a + ", " + (p[2] === "00" ? "unhurt" : "injury " + S.inj) + " (%)";
  }
  function drawCompare() {
    var sG = setKeyAct("greedy"), sS = setKeyAct("sampled"), m = S.measure;
    var keys = {};
    [sG, sS].forEach(function (s) { rowsFor(s).forEach(function (g) { keys[g.world + "|" + g.agent] = g; }); });
    var rows = Object.keys(keys).map(function (k) { return keys[k]; }).sort(function (a, b) { return a.world - b.world || (a.agent === "ordinary" ? -1 : 1); });
    if (!rows.length) return '<p class="f5-empty">No tested runs for this selection yet.</p>';
    function st(set, g) { var rids = g.rids.filter(function (r) { return D.data[set] && D.data[set][r]; });
      var o = stat(set, { rids: rids }, m); if (S.unc === "lay") o.s = layErr(set, g, m); return o; }
    var pts = rows.map(function (g) { return { g: g, gr: st(sG, g), sa: st(sS, g) }; });
    var isD = m.charAt(0) === "d", lo = isD ? 0 : -CMAX, hi = isD ? 100 : CMAX;
    pts.forEach(function (p) { [p.gr, p.sa].forEach(function (q) { if (isFinite(q.m)) {
      var e = isFinite(q.s) ? q.s : 0; lo = Math.min(lo, q.m - e); hi = Math.max(hi, q.m + e); } }); });
    lo = Math.floor(lo / 10) * 10; hi = Math.ceil(hi / 10) * 10;
    var W = Math.max(body.clientWidth || 900, 320), narrow = W < 600, keyRow = W < 800, L = narrow ? 112 : 230, R = 16, rh = 22, top = keyRow ? 50 : 34,
        H = top + rows.length * rh + 40;
    var hasG = !!D.data[sG], hasS = !!D.data[sS];
    function X(v) { return L + (v - lo) / (hi - lo) * (W - L - R); }
    var s = '<div class="f5-cmp"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(measureName(m)) +
      ', greedy against sampled actions, one row per world and agent">';
    for (var t = lo; t <= hi; t += (narrow || hi - lo > 80 ? 20 : 10)) {
      s += '<line x1="' + X(t) + '" x2="' + X(t) + '" y1="' + (top - 6) + '" y2="' + (H - 34) + '" stroke="' + tok(t === 0 ? "--rule" : "--line") + '" stroke-width="' + (t === 0 ? 1.5 : 1) + '"/>';
      s += '<text x="' + X(t) + '" y="' + (H - 18) + '" font-size="12" text-anchor="middle">' + (t > 0 && !isD ? "+" : "") + (t < 0 ? "\u2212" + (-t) : t) + "</text>";
    }
    s += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 2) + '" font-size="12.5" text-anchor="middle">' + esc(measureName(m)) + "</text>";
    pts.forEach(function (p, i) {
      var y = top + i * rh + rh / 2, lab = (p.g.world === 0 ? (narrow ? "L05" : "level 05") : "w" + p.g.world) + " " + (narrow ? p.g.agent.slice(0, 3) + "." : p.g.agent) + " (" + (narrow ? "" : "n=") + Math.max(p.gr.n, p.sa.n) + ")";
      if (i % 2 === 0) s += '<rect x="0" y="' + (y - rh / 2) + '" width="' + W + '" height="' + rh + '" fill="' + tok("--surface") + '" opacity=".55"/>';
      s += '<text x="' + (L - 10) + '" y="' + (y + 4) + '" font-size="12.5" text-anchor="end">' + esc(lab) + "</text>";
      [[p.gr, tok("--cmp-g"), -4], [p.sa, tok("--cmp-s"), 4]].forEach(function (q) {
        if (!isFinite(q[0].m)) return; var yy = y + q[2];
        if (isFinite(q[0].s)) s += '<line x1="' + X(q[0].m - q[0].s) + '" x2="' + X(q[0].m + q[0].s) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + q[1] + '" stroke-width="2"/>';
        s += '<circle cx="' + X(q[0].m) + '" cy="' + yy + '" r="4.5" fill="' + q[1] + '"/>';
      });
    });
    var lg = [[tok("--cmp-g"), hasG ? "greedy (most likely move)" : "greedy: not tested yet"],
              [tok("--cmp-s"), hasS ? "sampled from the policy" : "sampled: not tested yet"]];
    var ln = noLay() ? "no layout interval for this set" : "line: " + (S.unc === "lay" ? "layout 95% interval" : "±1 seed SD");
    if (keyRow) { var kx = narrow ? 8 : L;   // the key gets its own row whenever one line would not fit (below ~800 px)
      s += '<text x="' + kx + '" y="16" font-size="12"><tspan fill="' + lg[0][0] + '">●</tspan><tspan dx="4">' + lg[0][1] + '</tspan><tspan dx="12" fill="' + lg[1][0] + '">●</tspan><tspan dx="4">' + lg[1][1] + "</tspan></text>";
      s += '<text x="' + kx + '" y="34" font-size="12">' + ln + "</text>";
    } else {
      s += '<text x="' + L + '" y="16" font-size="12.5"><tspan fill="' + lg[0][0] + '">●</tspan><tspan dx="4">' + lg[0][1] + '</tspan><tspan dx="16" fill="' + lg[1][0] + '">●</tspan><tspan dx="4">' + lg[1][1] + '</tspan><tspan dx="16">' + ln + "</tspan></text>";
    }
    return s + "</svg></div>";
  }

  function detailHTML(set, g) {
    var cols = columns(), signed = S.view !== "dwell";
    var h = '<div class="f5-detail"><h4>' + rowLabel(g, g.rids.length) + ' — each seed</h4><p class="cue" hidden>&larr; wider than the screen &mdash; scroll it sideways</p><div class="scroll"><table><thead><tr><th>seed</th><th>checkpoints (M steps)</th>';
    cols.forEach(function (c) { h += "<th>" + esc((c.grp === 0 ? (S.view === "dwell" ? "unhurt, " : "injury, ") : (S.view === "dwell" ? "inj. " + S.inj + ", " : "")) + c.top) + "</th>"; });
    h += "</tr></thead><tbody>";
    g.rids.slice().sort(function (a, b) { return D.runs[a].seed - D.runs[b].seed; }).forEach(function (rid) {
      var st = D.data[set][rid].steps;
      h += "<tr><td>" + D.runs[rid].seed + "</td><td>" + (st[0] / 1e6).toFixed(1) + "–" + (st[st.length - 1] / 1e6).toFixed(1) + "</td>";
      cols.forEach(function (c) { var s = series(set, rid, c.id);
        h += "<td>" + fmt(mean(s), signed) + ' <small style="color:var(--ink-3)">±' + sd(s).toFixed(0) + "</small></td>"; });
      h += "</tr>";
    });
    return h + '</tbody></table></div><p style="font-size:12.5px;color:var(--ink-2);margin:6px 0 0">Each value: the mean over that seed\'s newest 20 tested checkpoints; ± is the standard deviation across those 20 checkpoints (how much the value moves late in training, not an error bar). Click the row again to close.</p></div>';
  }

  function legend() {
    var el = document.getElementById("f5-legend"), low = noLay() ? NOLAY : S.unc === "lay" ? "layout 95% interval" : "seed-to-seed SD";
    var empty = !!document.querySelector("#f5-body .f5-empty");
    if (empty || S.view === "compare") { el.innerHTML = ""; return; }
    if (S.view === "dwell") el.innerHTML = '<span>bush dwell, % of steps:</span> <span class="f5-nw">0 <span class="f5-ramp" style="background:linear-gradient(90deg,' + SEQ.join(",") + ')"></span> 100</span> <span>· lower number: ' + low + "</span>";
    else el.innerHTML = '<span>difference in bush dwell, points:</span> <span class="f5-nw">−' + CMAX + ' or less <span class="f5-ramp" style="background:linear-gradient(90deg,' + NEG.slice().reverse().join(",") + "," + POS.slice(1).join(",") + ')"></span> +' + CMAX + ' or more</span> <span>· lower number: ' + low + "</span>";
  }
  var PLANNED = ["off", "on"].reduce(function (o, h) { ["food", "nofood"].forEach(function (f) { ["sampled", "greedy"].forEach(function (a) {
    o.push("heal" + h + "_" + f + "_" + a); }); }); return o; }, []);
  function setName(s) { var p = s.split("_");
    return "healing " + p[0].slice(4) + ", " + (p[1] === "food" ? "with food" : "without food") + ", " + p[2]; }
  function dataStatement() {
    var all = Object.keys(D.runs).length, per = M.newest * M.animals.length * M.injuries.length * M.episodes;
    var cur = setKey(), n = D.data[cur] ? Object.keys(D.data[cur]).length : 0;
    var sum = D.data[cur] ? "This selection uses " + n + " of " + all + " finished runs (" + Math.round(100 * n / all) + "%)"
                          : "No runs tested for this selection yet";
    var h = '<details class="bb-data"><summary><b>Data.</b> ' + sum + ' &mdash; open for the counts</summary><p class="cue" hidden>&larr; wider than the screen &mdash; scroll it sideways</p><div class="scroll"><table class="wide" style="min-width:640px"><thead><tr><th>scene set</th><th class="n">runs used</th><th class="n">of finished</th><th class="n">share</th><th class="n">episodes</th><th>why</th></tr></thead><tbody>';
    PLANNED.forEach(function (s) {
      var k = D.data[s] ? Object.keys(D.data[s]).length : 0, inc = M.incomplete.filter(function (x) { return x.set === s; }).length;
      h += "<tr><td>" + setName(s) + '</td><td class="n">' + (D.data[s] ? k : "&mdash;") + '</td><td class="n">' + all + '</td><td class="n">' +
        (D.data[s] ? Math.round(100 * k / all) + "%" : "&mdash;") + '</td><td class="n">' + (D.data[s] ? (k * per).toLocaleString("en") : "&mdash;") + "</td><td>" +
        (D.data[s] ? "newest " + M.newest + " checkpoints × " + M.animals.length * M.injuries.length + " scenes × " + M.episodes + " episodes per run" +
          (inc ? "; " + inc + " run(s) left out until all 20 checkpoints are tested in every scene" : "") : "not tested yet") + "</td></tr>";
    });
    h += "</tbody></table></div><p>" + all + " finished runs (level-05 reference and worlds 1&ndash;16, every finished seed). Counts come from the data file the page reads, written by <code>dashboard_data.py</code>.</p><p>Layout 95% intervals are computed so far for: " +
      (M.layout_error_sets.length ? M.layout_error_sets.map(setName).join("; ") : "no set yet") + ". The other sets show n/a until their per-episode tables are extracted.</p></details>";
    document.getElementById("f5-data-stmt").innerHTML = h;
  }

  function state() {
    var t = { dwell: "Bush dwell", contrast: "Contrasts", compare: "Greedy vs sampled" }[S.view];
    return t + " · " + (S.view === "compare" ? "both action rules" : S.act + " actions") + " · healing " + S.heal + " · " +
      (S.food === "food" ? "with food" : "without food") + " · injury " + S.inj;
  }
  function render() {
    document.querySelectorAll(".f5-seg").forEach(function (seg) {
      var k = seg.getAttribute("data-k");
      seg.querySelectorAll("button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === S[k]));
        b.disabled = (k === "act" && S.view === "compare");
      });
    });
    document.getElementById("f5-measure-ctl").hidden = S.view !== "compare";
    document.getElementById("f5-healwarn").hidden = !(S.heal === "on" && S.view !== "dwell");
    document.getElementById("f5-state").textContent = state();
    document.getElementById("f5-body").innerHTML = S.view === "compare" ? drawCompare() : drawTable();
    var dt = body.querySelector(".f5-drow .f5-detail"); if (dt) dt.style.width = (body.clientWidth - 4) + "px";
    legend(); dataStatement();
    if (typeof updateCues === "function") updateCues();
  }
  var sel = document.getElementById("f5-measure");
  AN.forEach(function (a) { sel.insertAdjacentHTML("beforeend", '<option value="d:' + a[0] + ':00">bush dwell, ' + a[1] + ", unhurt</option>"); });
  AN.forEach(function (a) { sel.insertAdjacentHTML("beforeend", '<option value="d:' + a[0] + ':x">bush dwell, ' + a[1] + ", injured</option>"); });
  CONTRASTS.forEach(function (c) { sel.insertAdjacentHTML("beforeend", '<option value="' + c[0] + '">' + c[1] + "</option>"); });
  sel.value = S.measure;
  sel.addEventListener("change", function () { S.measure = sel.value; render(); });
  document.querySelectorAll(".f5-seg").forEach(function (seg) {
    seg.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b || b.disabled) return;
      S[seg.getAttribute("data-k")] = b.getAttribute("data-v"); render();
    });
  });
  function toggle(tr) { var k = tr.getAttribute("data-row"); S.sel = S.sel === k ? null : k; render();
    var r = body.querySelector('tr[data-row="' + k + '"]'); if (r) r.focus({ preventScroll: true }); }
  body.addEventListener("click", function (e) { var tr = e.target.closest("tr.f5-row"); if (tr) toggle(tr); });
  body.addEventListener("keydown", function (e) { var tr = e.target.closest("tr.f5-row");
    if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(tr); } });
  var rz = null;   // the compare chart is drawn for the container's width; redraw it when that changes
  window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () {
    if (S.view === "compare") return render();
    var dt = body.querySelector(".f5-drow .f5-detail"); if (dt) dt.style.width = (body.clientWidth - 4) + "px"; }, 150); });
  render();
})();
</script>
