# Analysis manifest — B2 "When does the modulator wake up?" (tooling plan Stage 4, run_wakeup.py).
#
# Plain language. For each measure of the modulator's activity over training (how much of the
# gradient it takes, how fast its weights move, how much its output varies with the situation, how
# large its gain swing is, how much survival it costs to freeze it), find the point where the
# measure has covered half of its change from the untrained network to the end of training, in the
# direction it actually moves; then ask whether that is before or after the agent's survival levels
# off. If the modulator only wakes up after learning has levelled off, it cannot make learning
# faster — one candidate reason the modulated agent does not learn faster than the ordinary one.
#
# Runs: the 16 level-05 body-interaction modulated agents (one per world, seed 42, all 50
# checkpoints) and the 3 May-replication modulated agents (seeds 42-44), first stage (01_active)
# only — the only stage trained from scratch — with a stage-local final value.
#
# Registered 2026-09-30, BEFORE Stage 4 runs: no wake-up tool exists yet (scripts/analysis/nmn has no
# wakeup.py or untrained.py at this commit) and no B2 curve has been computed or seen.
name: algorithmic_null_wakeup
evidence_status: b2_wakeup
# ---------------------------------------------------------------------------------------------
# decision_rules (MANDATORY). The drivers read the file, check its sha256 equals the value below
# (mismatch -> ValueError), apply section B2 of the rules, and print path + sha256 +
# evidence_status on every data statement.
# ---------------------------------------------------------------------------------------------
decision_rules:
  file: docs/experiments/active/modulator_clues/algorithmic_null_decision_rules.yaml
  sha256: c74bea585304f5b41f440d6945603da62eb47850fd1851eb15d05dbd66701e3c

# ---------------------------------------------------------------------------------------------
# wakeup (the tooling plan's §8 block). Every value equals decision_rules.parameters.B2 in the
# pinned rules file, where each is justified from a stated principle; the driver checks equality
# and raises on any mismatch. Headline: fraction_of_rise = "50 % of the rise from the untrained
# network, in the direction the measure moves"; the literal "50 % of final" is reported beside it.
# ---------------------------------------------------------------------------------------------
wakeup:
  threshold_mode_headline: fraction_of_rise
  f: 0.5
  literal_f: 0.5
  plateau_f: 0.9
  final_k: 3
  noise_k: 3
  sustain: 2
  min_noise_points: 5
  noise_window_divisor: 3
  noise_window_max_fraction: 0.5
  lag_coincident_max_intervals: 1
  sign_test_alpha: 0.05
  sign_test_null_p: 0.5

