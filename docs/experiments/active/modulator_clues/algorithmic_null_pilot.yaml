# Analysis manifest — "What Both Agents Compute", PILOT (tool validation, Stage 3 of the tooling plan).
# One level-05 pair, world w0000 (no body-rule changes), ordinary and modulated, BOTH seed 42.
# It has no seed yardstick, so under the pre-registered rules it yields NO verdict word:
# decision_rules.evidence_status.pilot. Every figure reads
# "tool validation — the two agents share seed 42; not evidence".
name: algorithmic_null_pilot
evidence_status: pilot
# ---------------------------------------------------------------------------------------------
# decision_rules (MANDATORY). Pins the pre-registered rules, written 2026-09-29 and revised
# 2026-09-30 (see its `revisions`), both before any number existed. The drivers must: read the file, check its sha256 equals the value below
# (mismatch -> ValueError), and print path + sha256 + evidence_status on every data statement.
# ---------------------------------------------------------------------------------------------
decision_rules:
  file: docs/experiments/active/modulator_clues/algorithmic_null_decision_rules.yaml
  sha256: 5ef6f731d15ebac2f13917e6bf801b607c2b0834e59d52b13f273aae37e1bdc1

# ---------------------------------------------------------------------------------------------
# Designer-owned values (plan-reviewer re-review R7, R8). The developer completes the other keys
# of the tooling plan's manifest schema around them and leaves these values unchanged.
#   bootstrap_n: 2000 — above the rules' floor (parameters.gates.G6.bootstrap_n_min = 1000).
#     Principle: the Monte Carlo error of a 5th/95th-percentile tail at B draws is about
#     sqrt(0.05 * 0.95 / B) = 0.5 percentage points at B = 2000 (0.7 at 1000), small next to the
#     percentile it estimates. Same value in every manifest of this study.
#   n_per_store: 5000 — the whole first shard of each store (block 0 holds 5000 episodes,
#     episode_seed 1000000..1004999, identical in both stores: checked 2026-09-30). Both stores share
#     seed_base, so the pooled probe holds 5000 DISTINCT episode_seed groups, not 10000. Gate G6
#     needs >= 500 groups per held-out fold (test_frac 0.2 -> >= 2500 groups) for EVERY quantity
#     after its exclusions. The steps_remaining headline drops truncated episodes; a group is lost
#     only if both of its trajectories were truncated, which is 26.4 % of the groups of block 0
#     (a property of the stores, not a statistic under test). 5000 -> ~3680 groups -> ~736 per fold;
#     the reviewer's minimum of 2500 would give ~368 and fail G6.
#   inner_folds: 5 (set 2026-09-30 at Checkpoint R.2, before any real ridge fit) — the number of
#     internal cross-validation folds, grouped by episode_seed, used inside each training fold to
#     choose the ridge penalty (A1 predictivity, A2 decoding). Principle: the inner split mirrors
#     the outer one (test_frac 0.2 = one fifth held out), and it keeps every inner validation fold
#     large: here the steps_remaining headline's ~3680 groups leave ~2944 in a training fold,
#     ~589 per inner fold (above G6's 500-group floor for a held-out fold); 10 folds would give
#     ~294. It decides no verdict and is not a rules constant. Same value in every manifest of
#     this study; not to be moved after a pilot number is seen.
#   ridge_alphas: 19 values, 10^-2 to 10^7 in half-decade steps (set 2026-09-30, after the R.2
#     review and before any real fit; no pilot number existed). The ridge penalty used by every fit
#     of this study (A1 predictivity, A2 decoding, G4 controls), chosen per fit by the grouped
#     inner cross-validation of inner_folds. Principle: inputs are standardised, so the penalty
#     adds alpha to each squared singular value s^2 = n x (eigenvalue of the inputs' correlation
#     matrix), and a direction is shrunk by half when its eigenvalue equals alpha / n. With inner
#     training folds of roughly 3e4 (pilot: 50,000 rows x 0.8 x 0.8) to a few 1e5 rows (six stores),
#     the grid runs from no practical shrinkage (alpha / n ~ 1e-7, least squares) to shrinking every
#     direction but a handful of the largest (alpha / n above 20, against a mean eigenvalue of 1).
#     So the chosen value can sit inside the grid for layers of 64 to 1152 columns. Half-decade
#     steps mean neighbours differ by x3.16, so the R^2 lost to grid resolution is small. The
#     grid is wide, not tuned. If a fit's chosen alpha lands on either end, the data statement
#     reports it; the grid does not move after a number is seen. Same grid in every manifest.
# ---------------------------------------------------------------------------------------------
bootstrap_n: 2000
inner_folds: 5
ridge_alphas: [1.0e-2, 3.16228e-2, 1.0e-1, 3.16228e-1, 1.0, 3.16228, 1.0e+1, 3.16228e+1, 1.0e+2, 3.16228e+2, 1.0e+3, 3.16228e+3, 1.0e+4, 3.16228e+4, 1.0e+5, 3.16228e+5, 1.0e+6, 3.16228e+6, 1.0e+7]
probes:
  - id: w0000_pair_final
    stores:
      - results/trajectories_l05body/20260927-053057_rppo_l05body_w0000_t1none_s42/10000046/a1179698aa
      - results/trajectories_l05body/20260927-053059_rppo_l05body_w0000_t16quad_s42/10000021/2ef4474a8f
    n_per_store: 5000
    # Developer-owned (tooling plan §8): 5 kept rows per episode -> ~50,000 rows, enough for the
    # 1152-column per-sense layers (enc.uni.*) at any min_rows_per_column up to ~40; every step
    # of every episode is still replayed so the memory is exact. seed fixes which rows are kept.
    rows_per_episode: 5
    seed: 20260930
    # Float32 matmul mode each store was COLLECTED under, in the order of `stores`; the self-replay
    # checks (gates G1, G3) run in it. Ordinary store: collected on node 101 (RTX 2080 Ti, no TF32)
    # -> full float32 = "highest". Modulated store: node 106 (RTX 3090) -> JAX default = TF32 =
    # "default"; needs an Ampere/Ada GPU to reproduce. Source: the collection worklists under
    # results/trajectories_l05body/_scratch/level05_body_interactions_b0{1,2}/_worklists/. Measured
    # 2026-09-30 on 40 episodes: 100 % self-agreement in the listed mode, 99.80 % in the other.
    store_matmul_precision: [highest, default]

# Remaining keys of the tooling plan's manifest schema (§8) are added by developer when the tooling
# exists. Until then this file fails to load, as it should (no defaults). The pilot has one
# ordinary run, hence no UNTRAINED pair and no informative gate (rules evidence_status.pilot).

# ---------------------------------------------------------------------------------------------
# Developer-owned keys (tooling plan §8), added with Stage 2 (2026-09-30). The Stage 3 keys
# (comparisons, probe_split, min_rows_per_column) are added with Stage 3; ridge_alphas is
# designer-set above (2026-09-30).
# ---------------------------------------------------------------------------------------------
out_root: results/analysis/algorithmic_null
# Matmul mode of every kept activation and of the chain assertions: full float32 for every agent,
# so no agent's layers carry another's device rounding.
capture_matmul_precision: highest
# Episodes whose every step is recomputed link by link on the real checkpoint (chain assertions).
assert_n_episodes: 8
# The plan's own abort tolerances that no gate covers; they decide no verdict.
tool_checks:
  shift_change_rows_max: 0.05     # shift-by-one agreement on action-change rows (0 % if aligned)
  self_similarity_atol: 1.0e-12   # same-agent CKA must equal 1 within this (float64)
  # Revision 4 (R4-4): the sampled-row buffer vs a separate full capture, per kept row
  # max_j|d_ij| / max(1, max_j|ref_ij|). Basis: >= 100x the observed rounding (8.3e-6 on an RTX
  # 3090, 1.18e-5 on an RTX 4090, both rnn.state, carried through the memory from h0) and, as
  # the planted one-step slot shift in each capture report must confirm, >= 10x below a
  # one-step slot error. A tool check; it decides no verdict.
  buffer_index_rel_tol: 1.0e-3
  # Cross-agent row alignment (code review, 2026-09-30): two agents' argmax actions on the same
  # kept rows agree at lag 0 by at least this much more than one kept row apart. Measured on
  # the interim probe: 0.67 at lag 0 vs 0.20 one row apart; a misaligned capture falls to the
  # lagged level (gap ~0). A tool check; it decides no verdict.
  row_lag_min_gap: 0.1
# Revision 4 (R4-2): the five verdict layers (rules common.verdict_layers), logits and value are
# kept at every capture; the descriptive layers (.raw / .mod keys, enc.uni.*) only at
# headline_capture. The pilot has one checkpoint and one probe, so its output is unchanged.
headline_capture: {checkpoint: final, probe: w0000_pair_final}
layers:
  - {key: enc.uni.raw, flatten: senses_x_units, keep: headline_only}
  - {key: enc.uni.mod, flatten: senses_x_units, keep: headline_only}
  - {key: enc.uni.out, flatten: senses_x_units, keep: headline_only}
  - {key: enc.raw, flatten: none, keep: headline_only}
  - {key: enc.mod, flatten: none, keep: headline_only}
  - {key: enc.out, flatten: none, keep: every_capture}
  - {key: rnn.state, flatten: none, keep: every_capture}
  - {key: rnn.raw, flatten: none, keep: headline_only}
  - {key: rnn.mod, flatten: none, keep: headline_only}
  - {key: rnn.out, flatten: none, keep: every_capture}
  - {key: actor.raw, flatten: none, keep: headline_only}
  - {key: actor.mod, flatten: none, keep: headline_only}
  - {key: actor.out, flatten: none, keep: every_capture}
  - {key: critic.raw, flatten: none, keep: headline_only}
  - {key: critic.mod, flatten: none, keep: headline_only}
  - {key: critic.out, flatten: none, keep: every_capture}
  - {key: logits, flatten: none, keep: every_capture}
  - {key: value, flatten: none, keep: every_capture}

# Stage 3 keys (tooling plan §8), developer-owned, added 2026-09-30 before any similarity or
# decoding number existed. comparisons: every pair of runs. probe_split.seed fixes the
# episode_seed-grouped split (and the across-episode shuffle of the G4 negative control);
# bootstrap_seed fixes the joint group bootstrap. min_rows_per_column: a layer is refused unless
# the rows it is scored on number at least 20 x its columns (the 1152-column enc.uni.* layers
# need ~23,000 rows; this probe keeps ~48,600), so no underdetermined ridge is fitted.
comparisons: auto
probe_split: {seed: 20260930, bootstrap_seed: 20260931}
min_rows_per_column: 20

runs:
  - {label: ordinary_s42, path: results/JAX_RecurrentPPO/20260927-053057_rppo_l05body_w0000_t1none_s42, checkpoints: [final]}
  - {label: modulated_s42, path: results/JAX_RecurrentPPO/20260927-053059_rppo_l05body_w0000_t16quad_s42, checkpoints: [final]}
