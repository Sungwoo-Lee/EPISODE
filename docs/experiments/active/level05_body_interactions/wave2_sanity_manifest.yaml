# Analysis manifest for the §4.6 KNOWN-INPUT CHECK (Wave-2 level-05 stores, both agents), added
# 2026-09-28 by experiment-analyzer after plan-reviewer finding A1. Identical to analysis_manifest.yaml
# in every band, range and threshold; only the run list (wave2_sanity_runs.yaml), the output folder and
# the WandB ids differ. Felt-injury / temperature cut-points are frozen from the Wave-2 ordinary run.
study: level05_wave2_sanity
design_doc: docs/experiments/active/level05_body_interactions/LEVEL05_BODY_INTERACTIONS.md
collection_spec: docs/experiments/active/level05_body_interactions/wave2_sanity_runs.yaml   # runs + store root
out_dir: results/analysis/level05_body_interactions/wave2_sanity

# World code in each run label `wXXXX_<agent>`: one digit per factor, in this order (1 = on).
factors: [B5, B3, A1, A4]
factor_labels:
  B5: healing slows when hungry
  B3: healing costs food
  A1: being away from 0 degrees costs food
  A4: scarcer food
agents: [ordinary, modulated]
difference: [modulated, ordinary]          # D_w = modulated - ordinary
reference_label: w0000_ordinary            # felt-injury and temperature cut-points are frozen from this run

# Which stores: the checkpoint read by default, and the pooled late window used ONLY when a world's
# final-checkpoint cells fall short (§4.1): the newest N checkpoints (including the final one).
checkpoint: final
late_window_checkpoints: 5

# Measures 1 and 3: fixed contrasts (§4.1, Revision 1). Intervals are [lo, hi) for nutrition and
# [lo, hi] (inclusive) for injury, as registered: hungry < 60, fed >= 100, low 0-20, high 60-100.
nutrition_bands:
  hungry: [0.0, 60.0]
  fed: [100.0, 1.0e+9]
injury_ranges:
  low: [0.0, 20.0]
  high: [60.0, 100.0]
min_steps_per_cell: 200
felt_injury_quantiles: [0.2, 0.8]          # bottom / top fifth of felt injury in the reference run
felt_injury_slot: Interoceptive Nociception
temperature_slot: Body Temperature

# Measure 4: behavioural combination gain (§4.1).
gain_bins: 10
gain_nutrition_range: [0.0, 200.0]
gain_injury_range: [0.0, 100.0]
gain_temperature_percentiles: [0.5, 99.5]  # of the reference run; outer bins open-ended
min_steps_per_gain_bin: 200                # any variable's bin below this is dropped and counted (§2.8)

# Survival (measure 2): WandB local binary, `_window_n`-weighted Episode/Steps over (0.9 N, N].
survival_readout_fraction: 0.10
collapse_fraction: 0.60                    # §5: survival < 0.60 x w0000 of the same agent

# §4.3 Lenth margins.
lenth_alpha: 0.05

# WandB run IDs of the two Wave-2 level-05 runs (BASIC_LEVELS_Q2_DEFAULT).
wandb_ids:
  w0000_ordinary: z2u1orlf
  w0000_modulated: ihq3tt7f
