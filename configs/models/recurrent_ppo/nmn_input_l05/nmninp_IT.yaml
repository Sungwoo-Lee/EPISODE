agent:
  algorithm: RecurrentPPO
  lr_actor: 0.0005
  lr_critic: 0.0005
  gamma: 0.95
  K_epochs: 4
  eps_clip: 0.1
  sequence_length: 128
  frame_stack: 1
  fc_layers: [128, 128]
  actor_fc_layers: [128, 128]
  critic_fc_layers: [128, 128]
  hidden_size: 128
  entropy_coef: 0.01
  gae_lambda: 0.95
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_layer_norm: true
  rnn_type: GRU
  activation: relu
  return_mode: GAE_NORM
  encoding_mode: hierarchical
  hierarchical_params:
    default_mlp: [128, 128]
    unimodal_overrides:
      visual: [128, 128]
      olfaction: [128, 128]
    multimodal_hub: [128, 128]
  modulation:
    type: FiLM
    mod_hidden_size: 16
    grouping_size: 1
    percept_bias_init: 3.0
    percept_add_bias_init: 0.0
    memory_bias_init: 0.0
    memory_clip: [-2.0, 2.0]
    input_sensors: ["Satiation", "Body Temperature", "Interoceptive Nociception"]
    sites:
      encoder: true
      rnn: true
      actor: true
      critic: true
    rnn_mechanism: activation
    temperature:
      enabled: false
