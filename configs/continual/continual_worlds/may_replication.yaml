# Continual schedule -- REPLICATION of the May 2026 NMN double-return probe under today's settings:
# ACTIVE -> PASSIVE -> ACTIVE -> PASSIVE -> ACTIVE predator, trained FROM SCRATCH.
# Design doc: docs/experiments/active/continual_worlds/MAY_DOUBLE_RETURN_REPLICATION.md (section 3).
# Source probe: docs/experiments/active/hypervigilance/NMN_CONTINUAL_DOUBLE_RETURN_PROBE.md.
#
# Stage lengths are May's, unchanged (read from the May run's saved schedule.yaml):
#   01_active    0     -> 1.5 M   (1.5 M)   learn the active world from scratch
#   02_passive   1.5 M -> 3.0 M   (1.5 M)
#   03_active    3.0 M -> 3.7 M   (0.7 M)   first return
#   04_passive   3.7 M -> 4.4 M   (0.7 M)
#   05_active    4.4 M -> 5.1 M   (0.7 M)   second return
# 5.1 M episodes per run. No --load-checkpoint: the counter starts at 0, so the run starts in stage 01.
# Boundaries are cumulative episode counts; switches happen at iteration granularity (tens of
# episodes of drift per switch).
#
# Checkpoints every 100,000 episodes in every stage (May: 100k in stages 1-2, 50k in 3-5). Every
# boundary is a multiple of 100,000, so the first checkpoint at or after each boundary is the
# stage-end model, saved before the next iteration switches the world.
#
# Known Bug A2: every stage has the same roster (1 predator tagged `pred`, rabbits `rabbit_tl` and
# `rabbit_br`), so stage 0 already has the maximum slot count and per-tag labels never change.
continual:
  episode_boundaries: [1500000, 3000000, 3700000, 4400000, 5100000]
  checkpoint_frequencies: [100000, 100000, 100000, 100000, 100000]
