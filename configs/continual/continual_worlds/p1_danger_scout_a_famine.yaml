# Continual schedule -- continual-worlds sequence P1 REPLACEMENT (Danger-A <-> Famine):
# pre-trained Home -> Forage -> DANGER-A -> FAMINE -> DANGER-A -> FAMINE
# Design doc: docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md (Revision 2; sections 3.3, 3.4).
#
# *** READY (user approved 2026-09-29; design doc 3.7.7, decisions D4 / D5). ***
# The pre-registered world it replaces was dropped by the pilot rule (design doc 3.6). The replacement
# world(s) come from an EXPLORATORY scouting ladder that was not pre-registered (design doc Revision
# 1b / 2), so adopting them is the user's decision. Danger-A passes the survivable line for the modulated agent (131.0 >= 126.7) but NOT for the
# ordinary agent (122.6 < 124.9; best window 130.1): a 'one agent only' world under design doc 3.6.
#
# Boundaries by the pre-registered rule of design doc 3.3 (per concept, 1.5 x the slower agent's
# time to plateau, floor 1 M, cap 3 M, rounded up to 100,000):
#   Danger-A  T 384k / 260k  -> L 1,000,000 (floor)     Famine  T 452k / 484k  -> L 1,000,000 (floor)
#   stages: 01 Forage (to 11 M) | 02 Danger-A 11-12 M | 03 Famine 12-13 M | 04 Danger-A 13-14 M | 05 Famine 14-15 M
# Branch point B0 = 10,000,000 + L_Forage = 11,000,000 (design doc 3.4; Forage T 200k/200k -> L 1 M).
#
# BRANCHING: as P3 -- load the Forage branch-point copy (results/JAX_RecurrentPPO/
# cw_branchpoint_forage_<agent>_s42/models, first checkpoint at or after 11,000,000) with
# --load-checkpoint; the run starts directly in stage 02. Forage stays as stage 01 because train.py
# sizes the per-animal distance accumulators from stage 0 before the restore, and Forage (no hunting
# predator, 5 rabbit slots) keeps the later roster changes clear of Known Bug A2 (design doc 6.2, B1).
# Every stage has 5 rabbit slots.
#
# EPISODE COUNTER OFFSET: boundaries are CUMULATIVE episode counts on the restored counter
# (train.py ContinualSchedule.stage_for_episode), so they start above 10,000,000.
# 4 M episodes after the branch point. Checkpoint every 100,000 episodes -> 10 per stage; the first
# checkpoint at or after each boundary is the stage-end model for the forgetting matrix (5.3).
continual:
  episode_boundaries: [11000000, 12000000, 13000000, 14000000, 15000000]
  checkpoint_frequencies: [100000, 100000, 100000, 100000, 100000]
