# Continual schedule -- continual-worlds PILOT 2b (pipeline shakedown, NOT evidence):
# pre-trained Home -> Forage -> FOG -> DANGER -> FOG -> DANGER, 1,000,000 episodes per stage.
# Design doc: docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md (section 3.6, Pilot 2).
#
# Stages (alphabetical in configs/continual/continual_worlds/pilot2b_fog_danger_stages/):
#   01 forage_20x20   Forage, once
#   02 fog_15x15      A (first visit)      03 danger_15x15   B (first visit)
#   04 fog_15x15      A (return)           05 danger_15x15   B (return)
#
# PURPOSE: exercise four real GPU stage switches on the real pre-trained checkpoints, the checkpoint
# cadence, the stage/index rows and the forgetting-matrix sweep on a real continual run. 1 M episodes
# per stage is below the within-world plateau (design doc 3.3), so return-visit numbers from this run
# are NOT read as evidence for or against the modulator.
#
# EPISODE COUNTER OFFSET -- READ BEFORE EDITING. The run starts from a pre-trained checkpoint loaded
# with --load-checkpoint, which restores the episode counter (10,000,046 ordinary / 10,000,021
# modulated). Boundaries are CUMULATIVE episode counts on that restored counter
# (train.py ContinualSchedule.stage_for_episode), so they start above 10,000,000.
# Stage 01 (Forage) has no hunting predator, so the per-predator distance accumulators are sized to
# zero for the whole run (train.py sizes them from stage 0) and the later roster changes cannot hit
# Known Bug A2 (design doc 6.2, B1). Every stage has 5 rabbit slots for the same reason.
# Checkpoint every 100,000 episodes -> 10 per stage.
continual:
  episode_boundaries: [11000000, 12000000, 13000000, 14000000, 15000000]
  checkpoint_frequencies: [100000, 100000, 100000, 100000, 100000]
