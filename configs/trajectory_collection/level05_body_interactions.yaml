# Trajectory stores for the LEVEL 05 BODY-INTERACTIONS factorial (stage 3, 32 runs:
# 16 worlds x {ordinary t1none, modulated t16quad}, 10 M episodes each, launched 2026-09-27 05:30).
# Design: docs/experiments/active/level05_body_interactions/LEVEL05_BODY_INTERACTIONS.md §4.1, §4.5.
#
# THIS FILE IS THE FULL MANIFEST (all 32 runs). It is ALSO what the analysis scripts under
# scripts/analysis/studies/level05_body_interactions/ read to find their runs and stores.
#
# DO NOT launch it directly with run_collection.py while any run is still training:
# `checkpoints: [final]` takes whatever checkpoint exists at that moment, and the store's manifest
# fixes it for good. Launch through the finished-runs-only wrapper, which splits it into batches of
# FINISHED runs (log ends "Training complete"), each with its own scratch name, and is idempotent:
#   /home/vncuser/miniconda3/envs/grid_world_pain/bin/python \
#     scripts/analysis/studies/level05_body_interactions/launch_collection.py \
#     configs/trajectory_collection/level05_body_interactions.yaml --nodes 106 107 ...
# `run_collection.py <this file> --validate-only` validates whatever stores exist.
#
# FINAL checkpoint only (2026-09-28). The §4.4 time-course cadence (every fifth checkpoint, float16,
# 50,000 episodes) and the §4.3 late window (checkpoints 46-49, 100,000 episodes) are separate specs,
# added later. Everything scientific matches Wave 2 (basicq2_wave2.yaml): 1,000,000 episodes,
# seed_base 1000000 (so episode i faces the same reset draws as Wave 2 wherever the worlds agree),
# obs_precision float32, GPU, batch 5000, shard 5000, 200 blocks per cell (one cell per run).
name: level05_body_interactions
algo: rppo
out_root: results/trajectories_l05body
episodes: 1000000
seed_base: 1000000         # LOAD-BEARING - identical to Wave 1/2
checkpoints: [final]
nodes: [109]               # placeholder; the launch wrapper overrides per batch with live-free nodes
obs_precision: float32
npar: 1
device: gpu
batch_size: 5000
shard_episodes: 5000
blocks_per_cell: 200
