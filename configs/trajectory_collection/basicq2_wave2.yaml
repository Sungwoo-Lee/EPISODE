# Trajectory stores for WAVE 2 of the basic-levels neuromodulator comparison
# (`basic_levels_q2_cover`, launched 2026-09-22 18:24, still training).
#
# INCREMENTAL BY DESIGN. Only runs that have FINISHED are listed. A run still training must not be
# collected: `checkpoints: [final]` would take whatever checkpoint exists at that moment, and the
# store's manifest fixes `n_episodes` for good, so a store built from a half-trained agent cannot
# later be corrected -- only thrown away. Add runs to this file as they complete and re-run; the
# collector skips cells whose store is already complete.
#
# As of 2026-09-23 11:19 the finished runs are the four below. Level 06 is the first COMPLETE PAIR
# of the wave, so it is the first level on which a modulated-vs-unmodulated comparison can be made
# at matched training length.
#
# Everything else matches Wave 1's spec exactly -- 1,000,000 episodes, seed_base 1000000,
# obs_precision float32 -- because the whole point of this wave is to be compared against Wave 1,
# and any of those three differing silently breaks that comparison.
#
# Run with:
#   /home/vncuser/miniconda3/envs/grid_world_pain/bin/python \
#     scripts/eval/traj_collect/run_collection.py configs/trajectory_collection/basicq2_wave2.yaml
# Nodes below are free as of 11:19: the four finished runs released 106:0, 107:0, 108:0 and 108:1,
# and 109-113 finished Wave 1 collection. 101/103/104/105 and 106:1/107:1 are STILL TRAINING the
# ten unfinished runs and must not be touched. 114 has no pyarrow; 102 has a foreign tenant.
name: basicq2_wave2
algo: rppo
out_root: results/trajectories_basicq2_w2
episodes: 1000000
seed_base: 1000000         # LOAD-BEARING - identical to Wave 1 and to the ladder/grids
checkpoints: [final]
nodes: [109, 110, 111, 112, 113]
obs_precision: float32
npar: 1
device: gpu
batch_size: 5000
shard_episodes: 5000
blocks_per_cell: 200
runs:
  - {label: lvl04_control,   path: results/JAX_RecurrentPPO/20260922-182522_rppo_bq2cover_lvl04_t1none_s42}
  - {label: lvl05_control,   path: results/JAX_RecurrentPPO/20260922-182534_rppo_bq2cover_lvl05_t1none_s42}
  - {label: lvl06_control,   path: results/JAX_RecurrentPPO/20260922-182543_rppo_bq2cover_lvl06_t1none_s42}
  - {label: lvl06_modulated, path: results/JAX_RecurrentPPO/20260922-182547_rppo_bq2cover_lvl06_t16quad_s42}
  - {label: lvl05_modulated, path: results/JAX_RecurrentPPO/20260922-182538_rppo_bq2cover_lvl05_t16quad_s42}
  - {label: lvl04_modulated, path: results/JAX_RecurrentPPO/20260922-182527_rppo_bq2cover_lvl04_t16quad_s42}
