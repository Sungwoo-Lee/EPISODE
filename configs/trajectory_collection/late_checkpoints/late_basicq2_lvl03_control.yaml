# LATE-CHECKPOINT STORE for the integrated exploratory analysis
# (docs/experiments/active/basic_levels_q2_default/INTEGRATED_ANALYSIS_PLAN.md, Revision 2).
# 100,000 episodes at each of five checkpoints over the last 20 % of training -- or, when the
# agent pair trained for different lengths, the last 20 % of the SHORTER run, at matched steps.
# 100k is enough only for the COARSE measures: the power check recomputed them on the first 100k
# episodes of existing 1M stores and they moved by 0.02-0.34 points. Filtered analyses keep the
# 1M final-checkpoint stores. seed_base 1000000 is load-bearing: it pairs these episodes with every
# other store in the project.
# matched training length: both arms compared at <= 8,800,002 steps (88 %)
name: late_basicq2_lvl03_control
algo: rppo
out_root: results/trajectories_basicq2_late
episodes: 100000
seed_base: 1000000
checkpoints: [7000008, 7400007, 8000012, 8400004, 8600025]
nodes: []
obs_precision: float32
npar: 1
device: gpu
batch_size: 5000
shard_episodes: 5000
blocks_per_cell: 20
runs:
  - {label: basicq2_lvl03_control, path: results/JAX_RecurrentPPO/20260921-114840_rppo_basicq2_lvl03_t1none_s42}
