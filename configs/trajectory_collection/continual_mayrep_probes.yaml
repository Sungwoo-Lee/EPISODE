# Trajectory stores for the MAY REPLICATION (continual worlds, 5 stages: 01_active, 02_passive,
# 03_active, 04_passive, 05_active; 3 seeds x {ordinary t1none, modulated t16quad}).
# Plan: docs/develop/active/neuromodulation/ALGORITHMIC_NULL_ANALYSIS_TOOLING.md File Changes §12,
# Stage 6. Read by the evidence manifest
# docs/experiments/active/modulator_clues/algorithmic_null_mayrep.yaml:
#   final        -> probe `active`  (end of 05_active, hunting world)
#   stage_end:3  -> probe `passive` (end of 04_passive, non-hunting world, its own env_fp)
# Every other checkpoint the rules need (stage_end:0..2, stage_end:3:prev, final:prev) is
# REPLAYED on these two probes by run_activations; none of them needs a store of its own
# (plan Stage 6; the :prev checkpoints only on their own drift probe, Revision 4 R4-2).
#
# Manifest agreement (the manifests win over §12 where they disagree):
#   n_per_store 5000 = the whole FIRST shard (block 0) of each store -> shard_episodes 5000,
#     episodes >= 5000. episodes 10000 (two blocks) is §12's value; the second block is not read
#     by the registered probes.
#   All stores of a probe share seed_base (5000 distinct episode_seed groups) -> one seed_base,
#     no per-run override. 1000000 as Wave 1/2 and level 05.
#   Full float32 (Revision 4, R4-1): obs_precision float32; the collector forces
#     matmul_precision highest and self-tests it; no knob here.
#
# DO NOT launch directly with run_collection.py while any run is still training (final = newest
# checkpoint at that moment). Launch through the finished-runs-only wrapper, logs NAMED:
#   /home/vncuser/miniconda3/envs/grid_world_pain/bin/python \
#     scripts/analysis/studies/level05_body_interactions/launch_collection.py \
#     configs/trajectory_collection/continual_mayrep_probes.yaml \
#     --logs logs/20260929_153606.log logs/20260929_153614.log logs/20260929_153623.log \
#            logs/20260929_153632.log logs/20260929_153641.log logs/20260929_153650.log \
#     --nodes <live-free>
# Log -> tag (read from each log's `tag :` line, 2026-09-30): 153606 t1none_s42, 153614 t16quad_s42,
# 153623 t1none_s43, 153632 t16quad_s43, 153641 t1none_s44, 153650 t16quad_s44.
name: continual_mayrep_probes
algo: rppo
out_root: results/trajectories_cw_mayrep
episodes: 10000
seed_base: 1000000         # LOAD-BEARING - shared by every store of every May probe (interim too)
checkpoints: [final, "stage_end:3"]
nodes: [106]               # placeholder; the launch wrapper overrides per batch with live-free nodes
obs_precision: float32
npar: 1
device: gpu
batch_size: 5000
shard_episodes: 5000
blocks_per_cell: 2         # one cell per (run, checkpoint): one worker on one card writes a store
runs:
  - {label: ordinary_s42,  path: results/JAX_RecurrentPPO/20260929-153635_rppo_cw_mayrep_t1none_s42}
  - {label: modulated_s42, path: results/JAX_RecurrentPPO/20260929-153644_rppo_cw_mayrep_t16quad_s42}
  - {label: ordinary_s43,  path: results/JAX_RecurrentPPO/20260929-153652_rppo_cw_mayrep_t1none_s43}
  - {label: modulated_s43, path: results/JAX_RecurrentPPO/20260929-153702_rppo_cw_mayrep_t16quad_s43}
  - {label: ordinary_s44,  path: results/JAX_RecurrentPPO/20260929-153712_rppo_cw_mayrep_t1none_s44}
  - {label: modulated_s44, path: results/JAX_RecurrentPPO/20260929-153723_rppo_cw_mayrep_t16quad_s44}
