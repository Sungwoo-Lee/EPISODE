# Trajectory stores for WAVE 1 of the basic-levels neuromodulator comparison
# (`basic_levels_q2_default`, trained 2026-09-21, superseded by Wave 2 on 2026-09-22).
#
# WHY WAVE 1 IS COLLECTED AT ALL, given it was superseded. It is the CONTROL FOR THE ENVIRONMENT
# CHANGE ITSELF: the same fourteen agents, the same seven worlds, the same modulated-vs-unmodulated
# comparison, but trained in a world where hiding in a bush healed no faster than standing in the
# open and where fullness had no upper lethal end. Wave 2 against Wave 1 is the only way to ask
# whether making cover the only place healing works, and fullness two-sided, raises how much
# behaviour depends on internal state AT ALL -- for either arm. That question did not exist before
# 2026-09-22 and cannot be answered from Wave 2 alone.
#
# WHAT THESE STORES FEED. The analyses inventoried in
# docs/experiments/active/basic_levels_q2_default/REANALYSIS_INVENTORY.md -- context_dependence.py,
# the hiding-drivers GLM, and ladder figures 8, 9, 10-13, 14, 15. Every one of them reads a Parquet
# trajectory store; none of them can run from checkpoints, which is why this pass exists.
#
# ALL FOURTEEN RUNS ARE HERE, including the two 5x5 levels and the two thermal ones. Collection
# replays each run in ITS OWN world, so unlike the avoidance-probe sweep there is no
# observation-width mismatch to exclude anybody: widths 44, 52 and 58 each collect against the
# config their own run trained on.
#
# FOUR OF THE FOURTEEN ARE TRUNCATED. The modulated arms of levels 00-03 were stopped between 59%
# and 96% when the wave was superseded, so `checkpoints: [final]` means "the last checkpoint that
# exists", not "10M" for those four. Comparisons at matched training length are sound; comparisons
# at each run's own endpoint are not, and any figure drawing on levels 00-03 must say so.
#
# seed_base 1000000 is LOAD-BEARING and matches the sensor ladder, both range-0 neuromodulator
# grids and both extended-olfaction grids. It is what makes these populations PAIRED with those
# rather than merely the same size; changing it silently breaks every cross-page comparison.
#
# ONE PASS ONLY. `n_episodes` is manifest-guarded -- a store collected at 1,000,000 cannot later be
# extended, which is why an earlier grid needed a second root. Get the number right here.
#
# Run with:
#   /home/vncuser/miniconda3/envs/grid_world_pain/bin/python \
#     scripts/eval/traj_collect/run_collection.py configs/trajectory_collection/basicq2_wave1.yaml
# Nodes must be FREE: 101 and 103-108 are running the WAVE 2 training and must not be touched,
# 114 has no pyarrow in its conda env and fails instantly, and 102 has a foreign tenant that has
# killed runs before.
name: basicq2_wave1
algo: rppo
out_root: results/trajectories_basicq2_w1
episodes: 1000000
seed_base: 1000000
checkpoints: [final]
nodes: [109, 110, 111, 112, 113]
obs_precision: float32     # must match every other store these figures are compared against
npar: 1                    # correctness, not throughput: every GPU worker on a node lands on GPU 0
device: gpu
batch_size: 5000
shard_episodes: 5000
blocks_per_cell: 200       # 1,000,000 / 5,000
runs:
  - {label: lvl00_control,   path: results/JAX_RecurrentPPO/20260921-114816_rppo_basicq2_lvl00_t1none_s42}
  - {label: lvl00_modulated, path: results/JAX_RecurrentPPO/20260921-114820_rppo_basicq2_lvl00_t16quad_s42}
  - {label: lvl01_control,   path: results/JAX_RecurrentPPO/20260921-114824_rppo_basicq2_lvl01_t1none_s42}
  - {label: lvl01_modulated, path: results/JAX_RecurrentPPO/20260921-114827_rppo_basicq2_lvl01_t16quad_s42}
  - {label: lvl02_control,   path: results/JAX_RecurrentPPO/20260921-114832_rppo_basicq2_lvl02_t1none_s42}
  - {label: lvl02_modulated, path: results/JAX_RecurrentPPO/20260921-114836_rppo_basicq2_lvl02_t16quad_s42}
  - {label: lvl03_control,   path: results/JAX_RecurrentPPO/20260921-114840_rppo_basicq2_lvl03_t1none_s42}
  - {label: lvl03_modulated, path: results/JAX_RecurrentPPO/20260921-114843_rppo_basicq2_lvl03_t16quad_s42}
  - {label: lvl04_control,   path: results/JAX_RecurrentPPO/20260921-114847_rppo_basicq2_lvl04_t1none_s42}
  - {label: lvl04_modulated, path: results/JAX_RecurrentPPO/20260921-114851_rppo_basicq2_lvl04_t16quad_s42}
  - {label: lvl05_control,   path: results/JAX_RecurrentPPO/20260921-114858_rppo_basicq2_lvl05_t1none_s42}
  - {label: lvl05_modulated, path: results/JAX_RecurrentPPO/20260921-114901_rppo_basicq2_lvl05_t16quad_s42}
  - {label: lvl06_control,   path: results/JAX_RecurrentPPO/20260921-114905_rppo_basicq2_lvl06_t1none_s42}
  - {label: lvl06_modulated, path: results/JAX_RecurrentPPO/20260921-114909_rppo_basicq2_lvl06_t16quad_s42}
