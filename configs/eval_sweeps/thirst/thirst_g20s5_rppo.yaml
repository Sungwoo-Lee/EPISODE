# Probe-scene sweep for the thirst task -- WORLD `g20s5` (20x20 map, smell reach 5 squares).
#
# WHAT THIS MEASURES. For this world's two training runs (ordinary and modulated agent, seed 42),
# every saved checkpoint is replayed in the 12 fixed test scenes (no animal / hunting predator /
# chasing rabbit / chasing rabbit with its predator-like odour removed / wandering rabbit /
# wandering rabbit that smells like a predator, each at starting injury 0 and 70), 30 episodes
# each. Every scene has a pond (the environment always places one): bush time is read only up to
# the agent's first pond step, by scripts/analysis/basic_behaviour/probe_pond.py collate, from the
# recordings this sweep keeps (plan docs/develop/active/behavior/BASIC_BEHAVIOUR_WATER.md, R2.2).
#
# DO NOT DELETE `_scratch/` -- `probe_pond.py collate` reads it. Clean it only after the pond/
# CSVs pass completeness (plan R2.5).
#
# Scenes: configs/environment/experiment/behavior_probes/thirst/g20s5/
#   (generated by configs/environment/experiment/behavior_probes/thirst/generate_thirst_probes.py)
# Study: docs/experiments/active/thirst_task/THIRST_TASK.md
#
# `nodes:` is DELIBERATELY EMPTY -- fill it at launch from live state (gpu-status skill). The
# driver raises `ValueError: min() arg is an empty sequence` on an empty list: "fill in the
# nodes", not "the spec is broken". The eval runs on CPU (--device cpu); one spec per node at a
# time (each starts 18 worker processes); avoid nodes with live training or collection.
name: thirst_g20s5
algo: rppo
output_dir: results/eval/avoidance/metrics_history_rppo_thirst/g20s5
probe: configs/environment/experiment/behavior_probes/thirst/g20s5
conditions: all
episodes: 30
nodes: []
x_axis: steps
plot_measures: [bush_hiding, spatial_spread, survival_steps]
runs:
  - {label: g20s5_ordinary_s42, path: results/JAX_RecurrentPPO/20261002_012741_rppo_thirst_g20s5_t1none_s42}
  - {label: g20s5_modulated_s42, path: results/JAX_RecurrentPPO/20261002_012743_rppo_thirst_g20s5_t16quad_s42}
