# INJURY-GRID dwell sweep -- thermal arm cool, noise-matched battery -- level 06 only
# Scenes: no animal, predator, wandering rabbit, each at starting injury 0,10,...,90 (30 conditions),
# generated by configs/environment/experiment/behavior_probes/injury_grid/generate_injury_grid.py.
# Plan: docs/experiments/active/modulator_clues/INJURY_DEPENDENCE_PLAN.md (workstream A).
# 30 episodes x every saved checkpoint, same settings as the existing thermal/blocking-bush sweeps,
# so the injury-0 and injury-70 conditions reproduce Figure 9 of the clue page for the same checkpoints.
# A fresh output_dir is load-bearing: the driver schedules only checkpoints newer than those recorded.
# nodes: [] -- filled at launch from live GPU/diary state.
name: injurygrid_cool_noise_matched
algo: rppo
output_dir: results/eval/avoidance/metrics_history_rppo_injurygrid_cool_noise_matched
probe: configs/environment/experiment/behavior_probes/injury_grid/cool_noise_matched
conditions: all
episodes: 30
nodes: []
x_axis: steps
plot_measures: [bush_hiding, survival_steps]
runs:
  - {label: lvl06_control,   path: results/JAX_RecurrentPPO/20260922-182543_rppo_bq2cover_lvl06_t1none_s42}
  - {label: lvl06_modulated, path: results/JAX_RecurrentPPO/20260922-182547_rppo_bq2cover_lvl06_t16quad_s42}
