# INJURY-GRID dwell sweep -- CHASING RABBIT, neutral temperature scenes (thermal arm neutral, clean) -- level 05 pair (22 Sep, fast bush healing)
# Scene: the chasing rabbit at starting injury 0,10,...,90 (10 conditions), generated by
# configs/environment/experiment/behavior_probes/injury_grid/generate_injury_grid.py --chasing-rabbit.
# Adds the fourth B2 scene to the existing injurygrid_neutral_clean sweep (none / pred / rabbitwander) for the
# cross-run page's most-effective-conditions figures; bush dwell only (the glued-rabbit bug distorts the
# within-reach measure, not bush dwell). Injury 0 and 70 are byte-identical to thermal/neutral_clean, so they
# must reproduce the thermalprobe_neutral_clean values for the same checkpoints.
# 30 episodes x every saved checkpoint, as the other injury-grid sweeps. Fresh output_dir (load-bearing).
name: injurygrid_chase_neutral_clean
algo: rppo
output_dir: results/eval/avoidance/metrics_history_rppo_injurygrid_chase_neutral_clean
probe: configs/environment/experiment/behavior_probes/injury_grid/chase_neutral_clean
conditions: all
episodes: 30
nodes: [112]
x_axis: steps
plot_measures: [bush_hiding, survival_steps]
runs:
  - {label: lvl05_control,   path: results/JAX_RecurrentPPO/20260922-182534_rppo_bq2cover_lvl05_t1none_s42}
  - {label: lvl05_modulated, path: results/JAX_RecurrentPPO/20260922-182538_rppo_bq2cover_lvl05_t16quad_s42}
