# INJURY-GRID dwell sweep -- levels 02-04 (core scenes, observation 52)
# Scenes: no animal, predator, wandering rabbit, each at starting injury 0,10,...,90 (30 conditions),
# generated by configs/environment/experiment/behavior_probes/injury_grid/generate_injury_grid.py.
# Plan: docs/experiments/active/modulator_clues/INJURY_DEPENDENCE_PLAN.md (workstream A).
# 30 episodes x every saved checkpoint, same settings as the existing thermal/blocking-bush sweeps,
# so the injury-0 and injury-70 conditions reproduce Figure 9 of the clue page for the same checkpoints.
# A fresh output_dir is load-bearing: the driver schedules only checkpoints newer than those recorded.
# nodes: [] -- filled at launch from live GPU/diary state.
# lvl02_modulated was still training at 12:00 on 2026-09-24 (43/50); re-run this spec after it
# finishes and the driver adds only the new checkpoints.
name: injurygrid_core
algo: rppo
output_dir: results/eval/avoidance/metrics_history_rppo_injurygrid_core
probe: configs/environment/experiment/behavior_probes/injury_grid/core
conditions: all
episodes: 30
nodes: []
x_axis: steps
plot_measures: [bush_hiding, survival_steps]
runs:
  - {label: lvl02_control,   path: results/JAX_RecurrentPPO/20260922-182505_rppo_bq2cover_lvl02_t1none_s42}
  - {label: lvl02_modulated, path: results/JAX_RecurrentPPO/20260922-182509_rppo_bq2cover_lvl02_t16quad_s42}
  - {label: lvl03_control,   path: results/JAX_RecurrentPPO/20260922-182514_rppo_bq2cover_lvl03_t1none_s42}
  - {label: lvl03_modulated, path: results/JAX_RecurrentPPO/20260922-182518_rppo_bq2cover_lvl03_t16quad_s42}
  - {label: lvl04_control,   path: results/JAX_RecurrentPPO/20260922-182522_rppo_bq2cover_lvl04_t1none_s42}
  - {label: lvl04_modulated, path: results/JAX_RecurrentPPO/20260922-182527_rppo_bq2cover_lvl04_t16quad_s42}
