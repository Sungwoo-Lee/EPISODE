# INJURY-GRID dwell sweep -- CHASING RABBIT, core scenes -- level 04 pair (22 Sep, fast bush healing)
# Scene: the chasing rabbit at starting injury 0,10,...,90 (10 conditions), generated by
# configs/environment/experiment/behavior_probes/injury_grid/generate_injury_grid.py --chasing-rabbit.
# Adds the fourth B2 scene to the existing injurygrid_core sweep (none / pred / rabbitwander) for the
# cross-run page's most-effective-conditions figures; bush dwell only (the glued-rabbit bug distorts the
# within-reach measure, not bush dwell). Injury 0 and 70 are byte-identical to core/avoidance, so they
# must reproduce the basicq2_wave2_blocking_bush values for the same checkpoints.
# 30 episodes x every saved checkpoint, as the other injury-grid sweeps. Fresh output_dir (load-bearing).
name: injurygrid_chase_core
algo: rppo
output_dir: results/eval/avoidance/metrics_history_rppo_injurygrid_chase_core
probe: configs/environment/experiment/behavior_probes/injury_grid/chase_core
conditions: all
episodes: 30
nodes: [104, 105]
x_axis: steps
plot_measures: [bush_hiding, survival_steps]
runs:
  - {label: lvl04_control,   path: results/JAX_RecurrentPPO/20260922-182522_rppo_bq2cover_lvl04_t1none_s42}
  - {label: lvl04_modulated, path: results/JAX_RecurrentPPO/20260922-182527_rppo_bq2cover_lvl04_t16quad_s42}
