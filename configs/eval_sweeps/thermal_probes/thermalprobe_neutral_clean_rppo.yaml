# Bush-hiding history on the THERMAL probe battery -- arm `neutral`, battery `clean`.
#
# WHAT THIS MEASURES. How much time each agent spends hidden in the bush, checkpoint by
# checkpoint across training, for the four finished Wave 2 runs of the `basic_levels_q2_cover`
# study (launched 2026-09-22) that train on the two body-temperature levels of the curriculum.
# Those agents read a 58-number observation; the existing 12-probe battery produces 52 numbers
# with body temperature switched off, so it does not fit them at all, and switching temperature
# on at the training world's own ambient makes the agent freeze to death after roughly 86-99
# steps -- inside the 100-step probe. This spec points the same sweep driver at a probe battery
# whose thermal channel is habitable.
#
# THIS ARM -- neutral: ambient 0.0 -- thermal on, no gradient. Body pins at +0.00 forever, every one of
#   the 100 cells is survivable, and the thermal term of the drive is exactly zero, so the
#   drive reduces to the same two-axis form the level-04 probes use. The closest thing to
#   a like-for-like comparison with the level-04 numbers this battery can offer.
#
# THIS BATTERY -- clean: no perceptual noise (the disabled block in environment/default is inherited).
#   Level-05 agents get this battery ONLY -- they never trained with perceptual noise --
#   and level-06 agents get it too, as the cross-level-comparable set.
#
# OFF-DISTRIBUTION BY NECESSITY. At equilibrium the thermoceptor reads exactly one third of the
# world's ambient temperature and the body sits at two thirds of it, so reproducing the training
# world's away-from-fire reading (about -10) and surviving 100 steps are mutually exclusive.
# Every habitable probe is therefore off-distribution on the thermal channel. That is why all
# four arms exist and why a result is only believed when it holds ACROSS them -- see the design
# doc for the pre-registered reading rules.
#
# WAVE 2 ONLY, ON PURPOSE. Wave 1 trained with `max_satiation: 100` and the satiation
# observation is `state.satiation / params.max_satiation`, so a Wave-1 agent in today's probe
# reads 0.5 where it trained to read 1.0 and would behave half-starved. Wave 1 is out of scope.
#
# INCREMENTAL. The driver only schedules checkpoints newer than each CSV's max step, so re-running
# this spec after more checkpoints land costs only the new ones.
#
# Design doc: docs/experiments/active/behavior_measures/thermal_probe_battery_bush_hiding.md
name: thermalprobe_neutral_clean
algo: rppo
output_dir: results/eval/avoidance/metrics_history_rppo_thermalprobe_neutral_clean
probe: configs/environment/experiment/behavior_probes/thermal/neutral_clean
conditions: all
episodes: 30
# DELIBERATELY EMPTY -- this spec does not choose nodes. Which lab nodes are free changes by the
# hour, and a node list baked in at design time either collides with a running job or wastes a
# free machine. The launcher fills this from LIVE state (the `gpu-status` skill /
# scripts/lab/gpu_status.py) at launch time. The driver fails loudly on an empty list rather than
# silently doing nothing: it raises `ValueError: min() arg is an empty sequence` out of
# `lpt_partition` in scripts/eval/dwell_sweep/run_sweep.py. That crash means "fill in the nodes",
# not "the spec is broken."
nodes: []
x_axis: steps
plot_measures: [bush_hiding, spatial_spread, survival_steps]
runs:
  - {label: lvl05_control, path: results/JAX_RecurrentPPO/20260922-182534_rppo_bq2cover_lvl05_t1none_s42}
  - {label: lvl05_modulated, path: results/JAX_RecurrentPPO/20260922-182538_rppo_bq2cover_lvl05_t16quad_s42}
  - {label: lvl06_control, path: results/JAX_RecurrentPPO/20260922-182543_rppo_bq2cover_lvl06_t1none_s42}
  - {label: lvl06_modulated, path: results/JAX_RecurrentPPO/20260922-182547_rppo_bq2cover_lvl06_t16quad_s42}
