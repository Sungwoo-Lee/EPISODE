# Bush-hiding history for WAVE 2 (`basic_levels_q2_cover`, launched 2026-09-22).
#
# INCREMENTAL, AND DELIBERATELY SHORT RIGHT NOW. The driver only schedules checkpoints newer than
# each CSV's max step, so this spec is meant to be re-run with more runs appended as they finish;
# nothing already evaluated is repeated.
#
# ONLY LEVEL 04's CONTROL IS HERE, and the reason is the probe battery rather than the wave:
#   levels 02/03/04 -> obs 52   the 10x10 probes match; of these only lvl04_control has finished
#   levels 00/01    -> obs 44   sight radius pinned to 1 on the 5x5 worlds; needs its own battery
#   levels 05/06    -> obs 58   thermal. These probe scenes contain no heat source, and with the
#                               world's ambient at -30 the body settles at -20 against a survivable
#                               floor of -15, so the agent FREEZES TO DEATH inside the probe.
#                               Measured, not assumed. lvl05_control, lvl06_control and
#                               lvl06_modulated have all finished and are all excluded for this
#                               reason -- they need a thermal probe with a fire placed in it, which
#                               is a scenario redesign rather than a config fix.
#
# lvl04_modulated was at 82.5% when this was written; append it here once it finishes so the level
# has a matched pair, then re-run.
#
# nodes: 108 and 113 are free -- 108's two runs (lvl06 control and modulated) finished, and 113 drew
# zero cells in the Wave 2 collection. 109-112 are COLLECTING trajectories right now and
# 101/103/104/105 plus 106:1/107:1 are still TRAINING; none of them may be used.
name: basicq2_wave2
algo: rppo
output_dir: results/eval/avoidance/metrics_history_rppo_basicq2_wave2
probe: configs/environment/experiment/behavior_probes/core/avoidance
conditions: all
episodes: 30
nodes: [108, 113]
x_axis: steps
plot_measures: [bush_hiding, spatial_spread, survival_steps]
runs:
  - {label: lvl04_control, path: results/JAX_RecurrentPPO/20260922-182522_rppo_bq2cover_lvl04_t1none_s42}
  - {label: lvl04_modulated, path: results/JAX_RecurrentPPO/20260922-182527_rppo_bq2cover_lvl04_t16quad_s42}
