# Probe-scene sweep for the single-channel smell hypervigilance study -- WORLD `two_channel`
# (control, level 05 as is; seed 42 = the level-05 factorial w0000 pair, rows C01/C02).
#
# WHAT THIS MEASURES. For each of this world's six training runs (ordinary and neuromodulated
# agent x seeds 42/43/44), every one of the 50 saved checkpoints is replayed in the 12 fixed test
# scenes (no animal / hunting predator / chasing rabbit / chasing rabbit with its predator-like
# odour removed / wandering rabbit / wandering rabbit that smells like a predator, each at
# starting injury 0 and 70), 30 episodes each; the behaviour measures (bush hiding, survival
# steps, ...) land one CSV row per checkpoint. 6 runs x 50 checkpoints x 12 scenes x 30 episodes.
# EXPLORATORY: not part of the study's pre-registered test (which reads trajectory stores from
# the training world). Its pre-stated reading rules are in the study doc's dated section
# "Probe-scene sweep (exploratory)".
#
# WHY THREE SPECS, NOT ONE. The driver takes exactly ONE probe directory per spec (`probe:`), and
# the scenes must differ by world (each scene `extends:` its world, and its animals smell like
# that world's animals). One spec per world, each writing its own subdirectory of
# results/eval/avoidance/metrics_history_rppo_hvsmell/, so the three can run concurrently without
# their worklists or completion markers colliding (same convention as the eight thermal-battery
# specs in configs/eval_sweeps/thermal_probes/).
#
# Scenes: configs/environment/experiment/behavior_probes/hvsmell/two_channel/
#   (generated by configs/environment/experiment/behavior_probes/hvsmell/generate_hvsmell_probes.py)
# Design: docs/experiments/active/hypervigilance/SINGLE_CHANNEL_SMELL_HYPERVIGILANCE.md
#
# `nodes:` is DELIBERATELY EMPTY -- fill it at launch from live state (gpu-status skill). The
# driver raises `ValueError: min() arg is an empty sequence` on an empty list: "fill in the
# nodes", not "the spec is broken". The eval runs on CPU (--device cpu); avoid nodes with live
# training, whose data pipeline it would starve.
#
# Run labels: <world tag>_<agent>_s<seed>. The single-channel tag is written `hv1ch_` with the
# trailing underscore wherever it is matched, because `hv1ch` is a prefix of `hv1chm`.
name: hvsmell_two_channel
algo: rppo
output_dir: results/eval/avoidance/metrics_history_rppo_hvsmell/two_channel
probe: configs/environment/experiment/behavior_probes/hvsmell/two_channel
conditions: all
episodes: 30
nodes: []
x_axis: steps
plot_measures: [bush_hiding, spatial_spread, survival_steps]
runs:
  - {label: hv2ch_ordinary_s42, path: results/JAX_RecurrentPPO/20260927-053057_rppo_l05body_w0000_t1none_s42}
  - {label: hv2ch_modulated_s42, path: results/JAX_RecurrentPPO/20260927-053059_rppo_l05body_w0000_t16quad_s42}
  - {label: hv2ch_ordinary_s43, path: results/JAX_RecurrentPPO/20261001-002435_rppo_hv2ch_t1none_s43}
  - {label: hv2ch_modulated_s43, path: results/JAX_RecurrentPPO/20261001-002439_rppo_hv2ch_t16quad_s43}
  - {label: hv2ch_ordinary_s44, path: results/JAX_RecurrentPPO/20261001-002444_rppo_hv2ch_t1none_s44}
  - {label: hv2ch_modulated_s44, path: results/JAX_RecurrentPPO/20261001-002449_rppo_hv2ch_t16quad_s44}
