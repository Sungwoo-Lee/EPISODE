# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): a concept world of the
# continual-worlds study, docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md.
#
# WINTER (15 x 15): bitter cold, one fire, and no bush beside it
#
# Ambient about -40 (level 05: about -30), exactly ONE fire, and no bush within Manhattan distance
# 3 of the fire (thermal.bush_min_fire_distance 3), so the agent cannot hide and warm at once.
# 0-2 hunting predators (brief 0-1 in Home-grid terms, x2.25). Food 2-9, ambushers/rocks/bushes at level-05 density; smell range 5.
# Fire temperature_ratio 10 (level 05: 11; fire = ratio x |ambient| = about 400). At 11 the
# first step from the ring onto the fire reached +15.65 on 1,000 real resets (death at +15), breaking
# level 05's 'first step onto a fire is survivable' target; at 10 the worst case is +11.73, inside
# level 05's own +10.9..+12.3 band, and only the 4 cells beside the fire are survivable to stand in.
#
# PER-CELL DENSITY (Revision 1, 2026-09-28): every count is set against HOME's per-cell density
# (level 05 on 100 cells); a count the concept brief gave in Home-grid terms is scaled by area
# (x2.25 at 15 x 15, round-half-up), so the concept's pressure holds per cell. Design doc 3.2.
#
# STATIONARY BY CONSTRUCTION: this file changes only the EXTERNAL world. Every body rule, the
# interoceptive channels, the reward, max_steps and the observation layout (58 numbers) are
# inherited unchanged from level 05 through `extends:`. Food energy per bite (6) and the bush
# healing multiplier (25) are body-side keys and are not touched.
# Lists (resources / entities / obstacles / location_areas) are restated in full because
# Config.merge replaces lists wholesale (CONFIG_GUIDE.md section 1); every entry not named
# above is level 05's entry verbatim with its placement box widened to the grid, the approach
# validated for 15 x 15 / 20 x 20 by scripts/analysis/studies/context_exploration/make_worlds.py.
# Generated once from level 05's resolved lists; values are pinned in the design doc (section 3.2).
