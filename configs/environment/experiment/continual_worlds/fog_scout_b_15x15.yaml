# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): a concept world of the
# continual-worlds study, docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md.
#
# EXPLORATORY SCOUT (Revision 1b, 2026-09-28) -- NOT PRE-REGISTERED. Scouting runs give the user
# replacement options for a world that failed the pre-registered survivable rule after its one
# softening step; they do NOT override that rule or its verdict (design doc Revision 1b).
#
# FOG-SCOUT-B (15 x 15): Fog's short smell range and blur, with NO sensor noise at all.
# Isolates smell range from noise (compare with Fog and Fog-soft).
# Change vs fog_15x15.yaml: perceptual_noise.enabled true -> false (= level 05 / Home). Disabling
# is used rather than sigma 0 because, while enabled, apply_perceptual_noise also CLIPS every
# modality (default.yaml perceptual_noise notes) -- sigma 0 would still not be Home's sensor path.
# Smell range 3 and the 3x sight blur (visual_blur_radial_scale 1.5) are unchanged. Everything else
# is fog_15x15.yaml verbatim through `extends:` (body = level 05, obs width 58).
extends: environment/experiment/continual_worlds/fog_15x15
perceptual_noise:
  enabled: false
