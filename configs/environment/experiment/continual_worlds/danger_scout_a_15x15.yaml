# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): a concept world of the
# continual-worlds study, docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md.
#
# EXPLORATORY SCOUT (Revision 1b, 2026-09-28) -- NOT PRE-REGISTERED. Scouting runs give the user
# replacement options for a world that failed the pre-registered survivable rule after its one
# softening step; they do NOT override that rule or its verdict (design doc Revision 1b).
#
# DANGER-SCOUT-A (15 x 15): as common as Danger-soft, but with Home-like persistence.
# Changes vs danger_15x15.yaml (hunting-predator entry only):
#   count 5-7 -> 3-5 (= Danger-soft), detection range 5-9 -> 3-5 cells,
#   chase stamina 100-200 -> 30-150 (Home's), lose-interest multiplier 2.0 -> 1.5 (Home's).
# Everything else is danger_15x15.yaml verbatim through `extends:` (body = level 05, obs width 58).
# The entities list is restated in full only because Config.merge replaces lists wholesale
# (CONFIG_GUIDE.md section 1); the rabbit entry is copied unchanged.
extends: environment/experiment/continual_worlds/danger_15x15
environment:
  entities:
  - class: predator
    behaviour: hunt
    tag: pred
    count_low: 3
    count_high: 5
    properties: [0.0, 0.7, 0.5, 0.0, 0.0]
    properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
    visual_properties: [1.0]
    visual_properties_std: [0.0]
    move_interval: [1, 1]
    damage: [15.0, 120.0]
    attack_delay: [1, 3]
    nociception_intensity: 0.9
    spawn_area:
    - [1, 1]
    - [15, 15]
    patrol_area:
    - [1, 1]
    - [15, 15]
    detection_range: [3, 5]
    max_stamina: [30, 150]
    stamina_recovery_rate: [1, 1]
    hunt_stamina_threshold: [0.7, 0.7]
    lose_interest_multiplier: [1.5, 1.5]
    attack_range: [2, 3]
    attack_success_rate: 0.5
  - class: neutral
    behaviour: wander
    tag: rabbit
    count_low: 0
    count_high: 5
    properties: [0.0, 0.5, 0.7, 0.0, 0.0]
    properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
    visual_properties: [1.0]
    visual_properties_std: [0.0]
    move_interval: [1, 1]
    damage: [0.0, 0.0]
    attack_delay: [0, 0]
    nociception_intensity: 0.1
    spawn_area:
    - [1, 1]
    - [15, 15]
    patrol_area:
    - [1, 1]
    - [15, 15]
