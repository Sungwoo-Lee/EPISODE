# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): a concept world of the
# continual-worlds study, docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md.
#
# EXPLORATORY SCOUT (Revision 1b, 2026-09-28) -- NOT PRE-REGISTERED. Scouting runs give the user
# replacement options for a world that failed the pre-registered survivable rule after its one
# softening step; they do NOT override that rule or its verdict (design doc Revision 1b).
#
# FOG-SCOUT-A (15 x 15): Fog-soft plus a longer smell range.
# Changes vs fog_15x15.yaml: perceptual-noise sigma halved (smell 0.3 -> 0.15, sight 0.2 -> 0.1;
# = Fog-soft) and smell range (sensory.sensor_radius, the olfactory radius) 3 -> 5. The 3x sight blur
# (visual_blur_radial_scale 1.5) and vision range are unchanged. Everything else is fog_15x15.yaml
# verbatim through `extends:` (body = level 05, obs width 58). The sensory and modality tables are
# dicts, so they deep-merge: only the named keys are overridden.
extends: environment/experiment/continual_worlds/fog_15x15
sensory: {sensor_radius: 5}
perceptual_noise:
  modalities:
    olfaction: {mode: constant, sigma: 0.15, injury_noise_scale: 0.0}
    visual: {mode: constant, sigma: 0.1, injury_noise_scale: 0.0}
