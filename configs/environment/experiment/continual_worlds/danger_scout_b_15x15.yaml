# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): a concept world of the
# continual-worlds study, docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md.
#
# EXPLORATORY SCOUT (Revision 1b, 2026-09-28) -- NOT PRE-REGISTERED. Scouting runs give the user
# replacement options for a world that failed the pre-registered survivable rule after its one
# softening step; they do NOT override that rule or its verdict (design doc Revision 1b).
#
# DANGER-SCOUT-B (15 x 15): fewer hunters, Danger's own hunting style.
# Changes vs danger_15x15.yaml: hunting predators 5-7 -> 2-4. Detection 5-9, stamina 100-200 and
# lose-interest 2.0 are Danger's, unchanged. Everything else is danger_15x15.yaml verbatim through
# `extends:` (body = level 05, obs width 58). The entities list is restated in full only because
# Config.merge replaces lists wholesale (CONFIG_GUIDE.md section 1).
extends: environment/experiment/continual_worlds/danger_15x15
environment:
  entities:
  - class: predator
    behaviour: hunt
    tag: pred
    count_low: 2
    count_high: 4
    properties: [0.0, 0.7, 0.5, 0.0, 0.0]
    properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
    visual_properties: [1.0]
    visual_properties_std: [0.0]
    move_interval: [1, 1]
    damage: [15.0, 120.0]
    attack_delay: [1, 3]
    nociception_intensity: 0.9
    spawn_area:
    - [1, 1]
    - [15, 15]
    patrol_area:
    - [1, 1]
    - [15, 15]
    detection_range: [5, 9]
    max_stamina: [100, 200]
    stamina_recovery_rate: [1, 1]
    hunt_stamina_threshold: [0.7, 0.7]
    lose_interest_multiplier: [2.0, 2.0]
    attack_range: [2, 3]
    attack_success_rate: 0.5
  - class: neutral
    behaviour: wander
    tag: rabbit
    count_low: 0
    count_high: 5
    properties: [0.0, 0.5, 0.7, 0.0, 0.0]
    properties_std: [0.0, 0.3, 0.3, 0.0, 0.0]
    visual_properties: [1.0]
    visual_properties_std: [0.0]
    move_interval: [1, 1]
    damage: [0.0, 0.0]
    attack_delay: [0, 0]
    nociception_intensity: 0.1
    spawn_area:
    - [1, 1]
    - [15, 15]
    patrol_area:
    - [1, 1]
    - [15, 15]
