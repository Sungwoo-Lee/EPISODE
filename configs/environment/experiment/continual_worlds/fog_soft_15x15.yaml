# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): a concept world of the
# continual-worlds study, docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md.
#
# FOG-SOFT (15 x 15): Fog with its ONE pre-registered softening step (design doc 3.6).
#
# Why: in Pilot 1 (2026-09-28 interim read-out, runs still finishing) BOTH agents failed the
# pre-registered survivable rule in Fog -- trailing-200k survival ~92 steps for each agent vs the
# pass lines 124.9 (ordinary) / 126.7 (modulated), curves flat. Design doc Revision 1a.
#
# The ONE change: perceptual-noise sigma halved -- smell 0.3 -> 0.15, sight 0.2 -> 0.1.
# Smell range 3 and the 3x sight blur are NOT changed. Everything else is fog_15x15.yaml verbatim,
# inherited through `extends:` (body = level 05, obs width 58). The modality table is a dict, so it
# deep-merges: only these two sigmas are overridden.
extends: environment/experiment/continual_worlds/fog_15x15
perceptual_noise:
  modalities:
    olfaction: {mode: constant, sigma: 0.15, injury_noise_scale: 0.0}
    visual: {mode: constant, sigma: 0.1, injury_noise_scale: 0.0}
