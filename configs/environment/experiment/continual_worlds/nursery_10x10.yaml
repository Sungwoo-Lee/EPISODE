# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): a concept world of the
# continual-worlds study, docs/experiments/active/continual_worlds/CONTINUAL_WORLDS.md.
#
# NURSERY (fresh pre-training only, 10 x 10): the gentlest level-05 world
#
# Plenty of food (4-6 items), plenty of bushes (8-12, allowed next to fires), 2-3 fires, few
# ambushers (0-2) and exactly ONE hunting predator that moves only every 3rd step, notices the
# agent only within 3-4 cells and hits for 15-45 (level 05: 15-120). Smell range 20, ambient
# temperature, rocks and rabbits as level 05.
#
# STATIONARY BY CONSTRUCTION: this file changes only the EXTERNAL world. Every body rule, the
# interoceptive channels, the reward, max_steps and the observation layout (58 numbers) are
# inherited unchanged from level 05 through `extends:`. Food energy per bite (6) and the bush
# healing multiplier (25) are body-side keys and are not touched.
# Lists (resources / entities / obstacles / location_areas) are restated in full because
# Config.merge replaces lists wholesale (CONFIG_GUIDE.md section 1); every entry not named
# above is level 05's entry verbatim with its placement box widened to the grid, the approach
# validated for 15 x 15 / 20 x 20 by scripts/analysis/studies/context_exploration/make_worlds.py.
# Generated once from level 05's resolved lists; values are pinned in the design doc (section 3.2).
extends: environment/experiment/basic/05-campfire_thermal_10x10
