# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): a world of the May
# double-return replication, docs/experiments/active/continual_worlds/MAY_DOUBLE_RETURN_REPLICATION.md.
#
# MAY-ACTIVE (10 x 10): the May 2026 probe's "active predator" world, rebuilt on today's schema
# with today's body.
#
# WHAT IT MIMICS. The external world the May run actually trained on, read from its SAVED stage
# config (results/JAX_RecurrentPPO/20260511-174837_rppo_nmn_cont_dr_mod_s0_r2/models/
# stage_00_01_active_predator.yaml), not from the stage YAML in configs/continual/ (which has
# drifted since). Fixed counts and quadrant placement, exactly as May:
#   food 2 in the top-left quadrant + 2 in the bottom-right (12 bites each, regrow at once);
#   ambushers (hiding_predator) 1 per quadrant; rocks 3 per quadrant; bushes 5 in each of the
#   two off-diagonal quadrants; 2 rabbits, one wandering in the top-left, one in the bottom-right;
#   ONE hunting predator over the whole grid: notices the agent from 5 cells, chase stamina 30
#   (recovers 1/step, hunts again once back to 70 %), gives up beyond 5 x 1.5 cells, pauses 3 steps
#   after a hit, hit damage 15-45, moves every step, NO pounce (May predated the jump feature).
#   The predator and both rabbits SMELL IDENTICAL ([0, 1, 0, 0, 0], no spread) -- May's
#   "sameProp" design: smell cannot tell a hunter from a rabbit, only behaviour can.
#
# WHAT IT KEEPS FROM TODAY (not May). Everything not listed above is inherited unchanged from
# level 05 through `extends:`: the body (two-sided nutrition 0-200 around setpoint 100 with
# over-eating death, healing only when resting, base 0.2, no compounding, BUSH HEALING x25, hits
# spread over 3 steps, felt injury through the 12-step kernel, random start nutrition 0-200 and
# injury 0-100), the drive-reduction reward, max 500 steps, the current senses (smell sampled on a
# 5-cell diamond with the canonical 1/distance falloff, decay_power 1.0 -- May ran 2.0; smell range
# 20; 1-channel presence vision on a 13-cell diamond), and bushes that animals cannot enter
# (blocks_animals: true, canonical since 2026-09-14; May's bushes were permeable).
#
# THERMAL OFF. May had no body-temperature system; level 05 has one. It is switched off here and
# the campfires are dropped (design doc 3.1), so the observation is 52 numbers, not level 05's 58.
# thermal.enabled false is the registry's canonical value; nothing in the registry changes.
#
# Lists (resources / entities / obstacles) are restated in full because Config.merge replaces
# lists wholesale (CONFIG_GUIDE.md section 1). The passive world (may_passive_10x10.yaml) extends
# THIS file and restates only `entities:`, so the two worlds differ in the predator entry alone.
extends: environment/experiment/basic/05-campfire_thermal_10x10
