# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): part of the level-05
# body-interactions study, docs/experiments/active/level05_body_interactions/LEVEL05_BODY_INTERACTIONS.md.
# FRAGMENT, NOT A WORLD: this file carries only the keys of one factor at one strength. It is
# meant to be layered on top of basic/05 through a list `extends:` in a pilots/ or worlds/
# file. Loaded alone it is missing every other mandatory key and will not build.
#
# A4 "scarcer food", BITE form: less energy per bite. food_nutrition_gain 6 -> 4, so the net
# gain per bite (gain minus the 1.0 eating cost) falls from 5 to 3. Nothing about where
# food is, or how much of it, changes. Simulation-study value: "food per bite (net) 3.0".
body:
  food_nutrition_gain: 4
