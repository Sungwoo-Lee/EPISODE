# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): part of the level-05
# body-interactions study, docs/experiments/active/level05_body_interactions/LEVEL05_BODY_INTERACTIONS.md.
# FRAGMENT, NOT A WORLD: this file carries only the keys of one factor at one strength. It is
# meant to be layered on top of basic/05 through a list `extends:` in a pilots/ or worlds/
# file. Loaded alone it is missing every other mandatory key and will not build.
#
# B5 "healing slows when hungry", strength = hunger floor 0.0.
# Healing per rest step is multiplied by a factor that is 1 at nutrition >= 100 (the
# setpoint), falls linearly to the floor 0.0 at nutrition <= 20, and stays there below 20.
# Over-full nutrition does NOT slow healing (overfull_floor 1.0). Ramp shape (20 -> 100) is the
# one the simulation study swept; see STATE_DEPENDENT_BODY_MECHANICS.md section A4b.
body:
  healing_nutrition_dependence: true
  healing_hunger_low: 20.0
  healing_hunger_high: 100.0
  healing_hunger_floor: 0.0
  healing_overfull_floor: 1.0
