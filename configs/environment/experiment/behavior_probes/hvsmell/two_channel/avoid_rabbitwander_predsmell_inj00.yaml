#   no predator look) trigger wariness? Contrast vs avoid_rabbitwander_inj00 (rabbit smell).
#   10x10, agent center [5,5]; hides_agent bush LEFT [5,2]; animal spawns RIGHT [5,9], wanders.
#
# ADDED vs the core probe: one campfire (the world's own entry) at config [5,3], beside the
