# ============================================================================
# THIRST PROBE -- world `g20s5` (20x20 map, smell reach 5 squares), scene `avoid_pred_inj70`
#
# One of 9 worlds x 12 scenes built for the thirst task (docs/experiments/active/thirst_task/THIRST_TASK.md), Figure 7 of its Basic
# Behaviour page (plan docs/develop/active/behavior/BASIC_BEHAVIOUR_WATER.md). GENERATED -- do not hand-edit; regenerate with
#   /home/vncuser/miniconda3/envs/grid_world_pain/bin/python configs/environment/experiment/behavior_probes/thirst/generate_thirst_probes.py \
#       --start-hydration 180 --worlds <cells>
#
# The file `extends:` the trained world, so everything the scene does not restate is the
# trained world's value. Kept from the world: map size 20x20, smell reach, pond size 4x4,
# water physics, temperature system, 59-number observation, visualization.local_view_size.
#
# SCENE (from configs/environment/experiment/behavior_probes/core/avoidance/avoid_pred_inj70.yaml; layout coordinates unchanged, grid / grass / patrol area set to the world's map):
#   Avoidance matrix — animal=pred (a HUNTING PREDATOR (harmful)), start injury=70.
#   10x10, agent center [5,5]; hides_agent bush 3 cells LEFT [5,2]; animal approaches from RIGHT [5,9].
#
# ADDED vs the core probe:
#   - one campfire (the world's own entry) at config [5,3], beside the hiding bush at [5,2]
#     (the world is cold; the bush is warm and survivable, the start cell [5,5] is not);
#   - the pond: one candidate, top-left config [8,8] (start + (3,3)) at every map size;
#   - start hydration FIXED at 180 (random_start_hydration: false), chosen by the pre-registered
#     calibration in the plan, section R2.3 (results/analysis/basic_behaviour/thirst/probes/calibration.json). Bush time is read only up to the
#     agent's first pond step (plan, section R2.2).
#
# MEASURED at generation (trainer loader + real env reset):
#   observation width 59; survivable cells 8/400; bush settles +5.98;
#   start cell settles -18.73; pond cells (array, 0-based) [(7, 7), (7, 8), (7, 9), (7, 10), (8, 7), (8, 8), (8, 9), (8, 10), (9, 7), (9, 8), (9, 9), (9, 10), (10, 7), (10, 8), (10, 9), (10, 10)]; animal odour [0.0, 0.7, 0.5, 0.0, 0.0]
# ============================================================================
extends: environment/experiment/thirst/pond_thirst_20x20_smell5
