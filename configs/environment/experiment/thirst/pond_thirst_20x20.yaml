# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): part of the thirst-task
# design, docs/experiments/active/thirst_task/THIRST_TASK.md. Only default.yaml and basic/ are
# maintained; this folder exists because the 15x15 and 20x20 thirst worlds are a study's worlds,
# not ladder rungs. A config-system change that breaks this file is NOT migrated (see CLAUDE.md).
#
# WORLD pond_thirst_20x20 (THIRST_TASK cell g20sW): level 06 (the pond + thirst world) on a
# 20 x 20 map, smell carrying across the whole map.
#
# What differs from level 06 (basic/06-pond_thirst_10x10.yaml), and nothing else:
#   - the grid is 20 x 20; every placement box ([[1, 1], [10, 10]] in level 05) is widened to
#     [[1, 1], [20, 20]] (food, ambushers, predator + rabbit spawn AND patrol, rocks, bushes,
#     campfires, grass);
#   - every count is scaled by area, x4 (round half up, low 0 stays 0), mirroring the
#     context-exploration C4 world (context_exploration/g20r5f4to16b12.yaml) exactly:
#       food 1-4 -> 4-16 (12 bites each, unchanged), ambushers 2-12 -> 8-48,
#       predators 0-2 -> 0-8, rabbits 0-2 -> 0-8, campfires 1-3 -> 4-12,
#       rocks 6-12 -> 24-48, bushes 4-10 -> 16-40;
#   - the pond is 4 x 4 (16 of 400 cells = 4 %, as 2 x 2 is of 100), at one of four corner
#     candidates just inside the 1-cell edge margin (1-based top-left [2,2], [2,16], [16,2],
#     [16,16]; the far block occupies rows/cols 16-19, leaving row/col 20 free);
#   - smell reach sensory.sensor_radius 40 = 2 x the side, the same rule as level 05's 20 on
#     10 x 10. The kernel measures EUCLIDEAN distance (sensor.py), and the largest distance on
#     this map is 26.9 (Manhattan 38), so the cut-off never binds: smell is whole-map.
# Inherited unchanged from level 06: water dynamics (drain 0.625, net drink +5, setpoint 100,
# max 200, random start hydration [0, 200)), smell water.properties [1, 0, 0, 0, 0] (each pond
# cell carries 1/16, so the pond smells like ONE food item), campfire edge_margin 2 and fire
# separation 4, the episode cap of 500 steps, and every sensor (observation width 59).
#
# Lists merge by REPLACEMENT (CONFIG_GUIDE.md section 1), so resources / entities / obstacles
# are restated in full, copied from level 05 with only areas and counts changed (bush keeps
# blocks_animals: true; tree keeps count 0).
extends: environment/experiment/basic/06-pond_thirst_10x10
environment:
  height: 20
  width: 20
  location_areas:
    - type: "grass"
      area: [[1, 1], [20, 20]]
