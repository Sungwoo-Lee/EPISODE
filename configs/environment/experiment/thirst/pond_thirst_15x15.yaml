# EXPERIMENTAL, NOT MAINTAINED (CLAUDE.md "Config maintenance scope"): part of the thirst-task
# design, docs/experiments/active/thirst_task/THIRST_TASK.md. Only default.yaml and basic/ are
# maintained; this folder exists because the 15x15 and 20x20 thirst worlds are a study's worlds,
# not ladder rungs. A config-system change that breaks this file is NOT migrated (see CLAUDE.md).
#
# WORLD pond_thirst_15x15 (THIRST_TASK cell g15sW): level 06 (the pond + thirst world) on a
# 15 x 15 map, smell carrying across the whole map.
#
# What differs from level 06 (basic/06-pond_thirst_10x10.yaml), and nothing else:
#   - the grid is 15 x 15; every placement box ([[1, 1], [10, 10]] in level 05) is widened to
#     [[1, 1], [15, 15]] (food, ambushers, predator + rabbit spawn AND patrol, rocks, bushes,
#     campfires, grass);
#   - every count is scaled by area, x2.25, with the context-exploration rule
#     low' = max(1, round(2.25 low)), high' = round(2.25 high), round HALF UP, low 0 stays 0.
#     This reproduces the context-exploration 15 x 15 worlds' counts exactly
#     (context_exploration/g15*_od), except food, which those worlds held at 1-2:
#       food 1-4 -> 2-9 (2.25 -> 2; 12 bites each, unchanged), ambushers 2-12 -> 5-27
#       (4.5 -> 5), predators 0-2 -> 0-5 (4.5 -> 5), rabbits 0-2 -> 0-5, campfires 1-3 -> 2-7
#       (2.25 -> 2, 6.75 -> 7), rocks 6-12 -> 14-27 (13.5 -> 14), bushes 4-10 -> 9-23
#       (22.5 -> 23). Half-up rounding errs toward MORE of each thing, by at most half an item.
#   - the pond is 3 x 3 (9 of 225 cells = 4 %, as 2 x 2 is of 100), at one of four corner
#     candidates just inside the 1-cell edge margin (1-based top-left [2,2], [2,12], [12,2],
#     [12,12]; the far block occupies rows/cols 12-14, leaving row/col 15 free);
#   - smell reach sensory.sensor_radius 30 = 2 x the side, the same rule as level 05's 20 on
#     10 x 10. The kernel measures EUCLIDEAN distance (sensor.py), and the largest distance on
#     this map is 19.8 (Manhattan 28), so the cut-off never binds: smell is whole-map.
# Inherited unchanged from level 06: water dynamics (drain 0.625, net drink +5, setpoint 100,
# max 200, random start hydration [0, 200)), smell water.properties [1, 0, 0, 0, 0] (each pond
# cell carries 1/9, so the pond smells like ONE food item), campfire edge_margin 2 and fire
# separation 4, the episode cap of 500 steps, and every sensor (observation width 59).
#
# Lists merge by REPLACEMENT (CONFIG_GUIDE.md section 1), so resources / entities / obstacles
# are restated in full, copied from level 05 with only areas and counts changed (bush keeps
# blocks_animals: true; tree keeps count 0).
extends: environment/experiment/basic/06-pond_thirst_10x10
